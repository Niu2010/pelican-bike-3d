<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鹈鹕海岸骑行 · Pelican Coast Ride 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#1b2a44;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .panel { position:fixed; z-index:10; color:#fff; background:rgba(10,24,40,.48);
    border:1px solid rgba(255,255,255,.22); border-radius:16px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 34px rgba(0,0,0,.30); }
  #titleCard { top:14px; left:14px; padding:12px 16px 10px; max-width:min(400px,80vw); }
  #titleCard h1 { font-size:20px; letter-spacing:1px; }
  #titleCard p { font-size:12px; opacity:.85; margin-top:3px; line-height:1.55; }
  #hud { top:14px; right:14px; padding:10px 16px; text-align:right; font-variant-numeric:tabular-nums; }
  #hud .big { font-size:24px; font-weight:700; }
  #hud .big small { font-size:12px; font-weight:400; opacity:.8; }
  #hud .sub { font-size:12.5px; opacity:.92; margin-top:2px; }
  #hud .sub b { color:#ffd94d; }
  #combo { color:#7be3ff; font-weight:700; }
  #autoBadge { display:none; margin-top:4px; font-size:11px; color:#aef3c1; letter-spacing:1px; }
  #ctrlCard { left:14px; bottom:14px; padding:12px 14px; width:min(360px,86vw); }
  .row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:9px; }
  .row:first-child { margin-top:0; }
  .lbl { font-size:12px; opacity:.85; width:38px; flex:none; letter-spacing:1px; }
  button { appearance:none; border:1px solid rgba(255,255,255,.35); cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff; font-size:12.5px;
    padding:6px 11px; border-radius:999px; transition:all .18s; user-select:none; }
  button:hover { background:rgba(255,255,255,.28); }
  button.on { background:#ffb340; border-color:#ffb340; color:#402a02; font-weight:700; }
  button:active { transform:scale(.95); }
  /* 成就 */
  #achBtn { position:relative; }
  #achCount { color:#ffd94d; font-weight:700; }
  #achPanel { position:fixed; z-index:30; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(520px,92vw); max-height:82vh; overflow:auto; padding:18px 20px; display:none; }
  #achPanel h2 { font-size:17px; margin-bottom:10px; }
  #achPanel .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ach { border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:9px 11px;
    background:rgba(255,255,255,.06); opacity:.45; }
  .ach.got { opacity:1; border-color:#ffd94d; background:rgba(255,217,77,.10); }
  .ach .t { font-size:13.5px; font-weight:700; }
  .ach .d { font-size:11.5px; opacity:.8; margin-top:2px; line-height:1.45; }
  #achClose { margin-top:12px; width:100%; }
  /* 成就 toast */
  #toasts { position:fixed; top:76px; left:50%; transform:translateX(-50%); z-index:40;
    display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast { background:linear-gradient(135deg, rgba(60,44,4,.92), rgba(24,20,4,.92));
    border:1px solid #ffd94d; color:#ffeeb0; border-radius:14px; padding:10px 18px;
    font-size:14px; box-shadow:0 8px 30px rgba(0,0,0,.45); animation:toastIn .35s ease-out; text-align:center; }
  .toast small { display:block; font-size:11.5px; opacity:.85; margin-top:2px; }
  @keyframes toastIn { from { opacity:0; transform:translateY(-14px) scale(.94); } to { opacity:1; transform:none; } }
  .toast.out { transition:opacity .5s; opacity:0; }
  /* 触屏按钮 */
  #touch { position:fixed; inset:auto 0 0 0; z-index:20; display:none;
    justify-content:space-between; padding:0 12px 86px; pointer-events:none; }
  #touch .cluster { display:flex; gap:10px; pointer-events:auto; }
  #touch button { width:58px; height:58px; border-radius:50%; font-size:19px; padding:0;
    background:rgba(10,24,40,.5); backdrop-filter:blur(6px); }
  #touch button small { display:block; font-size:9px; letter-spacing:.5px; opacity:.85; }
  body.touch #touch { display:flex; }
  body.touch #ctrlCard { bottom:auto; top:118px; }
  /* 开始遮罩 */
  #startOverlay { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, rgba(20,40,70,.25), rgba(5,10,22,.78));
    color:#fff; text-align:center; padding:20px; }
  #startOverlay .box { max-width:560px; }
  #startOverlay h1 { font-size:30px; letter-spacing:2px; text-shadow:0 4px 24px rgba(0,0,0,.6); }
  #startOverlay p { margin-top:12px; font-size:14px; line-height:1.9; opacity:.92; }
  #startOverlay kbd { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4);
    border-radius:6px; padding:1px 7px; font-family:inherit; font-size:12.5px; }
  #startBtn { margin-top:20px; font-size:17px; padding:12px 34px; background:#ffb340; color:#402a02;
    border-color:#ffb340; font-weight:800; letter-spacing:2px; }
  #loader { position:fixed; inset:0; z-index:55; display:flex; align-items:center; justify-content:center;
    background:#1b2a44; color:#fff; font-size:16px; letter-spacing:3px; transition:opacity .7s; }
  @media (max-width:680px){ #titleCard p{ display:none; } #hud .big{ font-size:19px; } }
</style>

<body>
<div id="app"></div>

<div class="panel" id="titleCard">
  <h1>🌅 鹈鹕海岸骑行 3D</h1>
  <p>戴头盔墨镜、系红围巾的鹈鹕在海岸公路上追鱼。围巾是实时布料物理，昼夜从黄昏流向星空月夜。</p>
</div>

<div class="panel" id="hud">
  <div class="big"><span id="kmh">0.0</span> <small>km/h</small></div>

</div>

<div class="panel" id="ctrlCard">
  <div class="row">
    <span class="lbl">镜头</span>

  <div class="row">
    <span class="lbl">动作</span>
    <button id="bellBtn">🔔 铃铛</button>

    <button id="wingBtn">🪽 展翅翘头</button>
    <button id="soundBtn">🔊 声音开</button>

  <div class="row">
    <span class="lbl">荣誉</span>
    <button id="achBtn">🏆 成就 <span id="achCount">0/14</span></button>

</div>

<div id="touch">
  <div class="cluster">
    <button id="tLeft">◀<small>变道</small></button>
    <button id="tRight">▶<small>变道</small></button>
  </div>
  <div class="cluster">
    <button id="tDown">▼<small>减速</small></button>
    <button id="tUp">▲<small>加速</small></button>
    <button id="tJump">⬆<small>跳跃</small></button>

</div>

<div id="toasts"></div>

</div>

<div id="startOverlay">
  <div class="box">
    <h1>🚲 鹈鹕海岸骑行</h1>
    <p>
      <kbd>W</kbd>/<kbd>S</kbd> 加速减速 · <kbd>A</kbd>/<kbd>D</kbd> 变道抓鱼 · <kbd>空格</kbd> 跳跃<br>
      <kbd>T</kbd> 展翅抬前轮 · <kbd>1</kbd>~<kbd>5</kbd> 切换镜头 · <kbd>B</kbd> 铃铛<br>
      不操作 5 秒，它会自己去追鱼。黄昏出发，骑进星空月夜。
    </p>
    <button id="startBtn">开始骑行</button>
  </div>
</div>
<div id="loader">正在组装鹈鹕、海岸和那条鱼…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 渲染器 / 场景 ================= */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe9b48c, 60, 230);
const camera = new THREE.PerspectiveCamera(47, innerWidth/innerHeight, 0.05, 900);
camera.position.set(1.2, 1.6, 6.4);
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.56;
controls.minDistance = 1.0; controls.maxDistance = 40;
controls.enabled = false;

/* ================= 天空 / 星 / 月 / 光 ================= */
const skyUni = {
  topColor:     { value: new THREE.Color(0x4a6aa8) },
  horizonColor: { value: new THREE.Color(0xffb37a) },
  offset:       { value: 10 },
  exponent:     { value: 0.75 }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(430, 28, 16),
  new THREE.ShaderMaterial({
    uniforms: skyUni, side: THREE.BackSide, depthWrite:false, fog:false,
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 topColor; uniform vec3 horizonColor; uniform float offset; uniform float exponent; varying vec3 vP;
      void main(){ float h = normalize(vP+vec3(0.0,offset,0.0)).y; float t = pow(max(h,0.0), exponent);
      gl_FragColor = vec4(mix(horizonColor, topColor, t), 1.0); }`
  })
);
scene.add(sky);

const starGeo = new THREE.BufferGeometry();
{
  const pts = [];
  for (let i=0;i<1100;i++){
    const a = Math.random()*Math.PI*2, e = Math.random()*Math.PI*0.49 + 0.04, r = 415;
    pts.push(Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
}
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:1.7, sizeAttenuation:false, transparent:true, opacity:0, fog:false, depthWrite:false });
scene.add(new THREE.Points(starGeo, starMat));

const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(11, 18, 14),
  new THREE.MeshBasicMaterial({ color:0xffdf8a, fog:false }));
scene.add(sunDisc);
const moonDisc = new THREE.Mesh(new THREE.SphereGeometry(8, 18, 14),
  new THREE.MeshBasicMaterial({ color:0xe8eef7, fog:false }));
scene.add(moonDisc);
const moonGlow = new THREE.Mesh(new THREE.SphereGeometry(11.5, 18, 14),
  new THREE.MeshBasicMaterial({ color:0xaFC4e8, transparent:true, opacity:0.18, fog:false }));
scene.add(moonGlow);

const hemi = new THREE.HemisphereLight(0xffd9b0, 0x51707e, 0.65); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffb066, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-17; sun.shadow.camera.right=17;
sun.shadow.camera.top=17; sun.shadow.camera.bottom=-10;
sun.shadow.camera.far=260; sun.shadow.bias=-0.0004;
scene.add(sun); scene.add(sun.target);
const amb = new THREE.AmbientLight(0xffffff, 0.10); scene.add(amb);

/* 昼夜关键帧：黄昏 → 日落 → 入夜 → 星空月夜 → 深夜 → 黎明前 → 回到黄昏 */
const CYCLE_KEYS = [
  { t:0.00, name:'黄昏',   top:0x4a6aa8, hor:0xffb37a, fog:0xe9b48c, sunC:0xffb066, sunI:2.0,  hemi:0.65, amb:0.10, stars:0.00, dark:0.00, sunEl: 16, sunAz:-115, exp:1.02 },
  { t:0.16, name:'日落',   top:0x3d4f86, hor:0xff8f5e, fog:0xdd9a72, sunC:0xff8f4d, sunI:1.5,  hemi:0.52, amb:0.09, stars:0.08, dark:0.18, sunEl:  5, sunAz:-122, exp:1.00 },
  { t:0.30, name:'暮色',   top:0x27355f, hor:0xc96a52, fog:0x8f6a72, sunC:0xff7a45, sunI:0.7,  hemi:0.38, amb:0.08, stars:0.38, dark:0.48, sunEl: -3, sunAz:-128, exp:0.98 },
  { t:0.45, name:'入夜',   top:0x0d1830, hor:0x2c3a58, fog:0x1c2a44, sunC:0x9db8e8, sunI:0.42, hemi:0.20, amb:0.06, stars:0.85, dark:0.88, sunEl:-14, sunAz:-134, exp:0.96 },
  { t:0.62, name:'星空月夜', top:0x060d20, hor:0x14263f, fog:0x0e1a2e, sunC:0xaec6ee, sunI:0.55, hemi:0.16, amb:0.05, stars:1.00, dark:1.00, sunEl:-24, sunAz:-140, exp:0.95 },
  { t:0.80, name:'深夜',   top:0x050a1a, hor:0x101c30, fog:0x0a1424, sunC:0xaec6ee, sunI:0.50, hemi:0.15, amb:0.05, stars:1.00, dark:1.00, sunEl:-30, sunAz:-146, exp:0.95 },
  { t:0.92, name:'黎明前', top:0x1c2c50, hor:0x6a5a6e, fog:0x3c4258, sunC:0xd9a06a, sunI:0.65, hemi:0.30, amb:0.07, stars:0.55, dark:0.62, sunEl: -6, sunAz:-152, exp:0.98 },
  { t:1.00, name:'黄昏',   top:0x4a6aa8, hor:0xffb37a, fog:0xe9b48c, sunC:0xffb066, sunI:2.0,  hemi:0.65, amb:0.10, stars:0.00, dark:0.00, sunEl: 16, sunAz:-115, exp:1.02 },
];
const CYCLE_LEN = 260; // 一整轮秒数
let cycleT = 0.0;      // 从黄昏开始
const _cA = new THREE.Color(), _cB = new THREE.Color();
function sampleCycle(t){
  let i = 0;
  while (i < CYCLE_KEYS.length - 2 && t > CYCLE_KEYS[i+1].t) i++;
  const a = CYCLE_KEYS[i], b = CYCLE_KEYS[i+1];
  const f = THREE.MathUtils.clamp((t - a.t) / (b.t - a.t), 0, 1);
  const L = (x, y) => x + (y - x) * f;
  const col = (ka, kb) => _cA.setHex(ka).lerp(_cB.setHex(kb), f).clone();
  return {
    name: f < 0.5 ? a.name : b.name,
    top: col(a.top, b.top), hor: col(a.hor, b.hor), fog: col(a.fog, b.fog), sunC: col(a.sunC, b.sunC),
    sunI: L(a.sunI, b.sunI), hemi: L(a.hemi, b.hemi), amb: L(a.amb, b.amb),
    stars: L(a.stars, b.stars), dark: L(a.dark, b.dark),
    sunEl: L(a.sunEl, b.sunEl), sunAz: L(a.sunAz, b.sunAz), exp: L(a.exp, b.exp),
  };
}
let cyc = sampleCycle(0);

/* ================= 地面 / 沙滩 / 海 ================= */
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
function noiseCanvas(base, speck, n=2400, size=256){
  const c = document.createElement('canvas'); c.width=c.height=size;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,size,size);
  for (let i=0;i<n;i++){
    g.fillStyle = speck[Math.floor(Math.random()*speck.length)];
    g.globalAlpha = 0.05 + Math.random()*0.10;
    const s = 1 + Math.random()*2.4;
    g.fillRect(Math.random()*size, Math.random()*size, s, s);
  }
  return c;
}
const grassTex = new THREE.CanvasTexture(noiseCanvas('#5d8a48', ['#4c7839','#6f9c58','#557f42']));
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(70,70);
grassTex.colorSpace = THREE.SRGBColorSpace;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(760, 760),
  new THREE.MeshStandardMaterial({ map:grassTex, roughness:1 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.03; ground.receiveShadow = true;
scene.add(ground);

const sandTex = new THREE.CanvasTexture(noiseCanvas('#d9b77c', ['#c8a566','#ecd096','#bfa05f']));
sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping; sandTex.repeat.set(80,3);
sandTex.colorSpace = THREE.SRGBColorSpace;
const beach = new THREE.Mesh(new THREE.PlaneGeometry(760, 7.2),
  new THREE.MeshStandardMaterial({ map:sandTex, roughness:1 }));
beach.rotation.x = -Math.PI/2; beach.position.set(0, 0.0, -7.1); beach.receiveShadow = true;
scene.add(beach);

/* 海面：顶点波浪 + 菲涅尔 + 浪尖泡沫 + 月光碎银 */
const oceanUni = THREE.UniformsUtils.merge([
  THREE.UniformsLib.fog,
  { time:{ value:0 }, dark:{ value:0 },
    deepColor:{ value:new THREE.Color(0x14507e) },
    shallowColor:{ value:new THREE.Color(0x3f8fb8) },
    foamColor:{ value:new THREE.Color(0xeafcff) } }
]);
const oceanMat = new THREE.ShaderMaterial({
  uniforms: oceanUni, transparent:false, fog:true,
  vertexShader:`
    #include <fog_pars_vertex>
    uniform float time;
    varying vec3 vWorld; varying float vH;
    float waveH(vec2 p){
      return sin(p.x*0.105 + time*0.9)*0.20
           + sin(p.y*0.155 - time*0.68)*0.17
           + sin((p.x+p.y)*0.048 + time*0.42)*0.26;
    }
    void main(){
      vec4 wp0 = modelMatrix * vec4(position, 1.0);
      float h = waveH(wp0.xz);
      vec3 pos = position + vec3(0.0, 0.0, 1.0) * h;
      vH = h;
      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vWorld = wp.xyz;
      vec4 mvPosition = viewMatrix * wp;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader:`
    #include <fog_pars_fragment>
    uniform float time; uniform float dark;
    uniform vec3 deepColor; uniform vec3 shallowColor; uniform vec3 foamColor;
    varying vec3 vWorld; varying float vH;
    void main(){
      vec3 V = normalize(cameraPosition - vWorld);
      float fres = pow(1.0 - max(V.y, 0.0), 2.0);
      vec3 col = mix(deepColor, shallowColor, 0.25 + fres*0.65);
      col = mix(col, col*0.42, dark*0.72);
      float crest = smoothstep(0.34, 0.58, vH);
      col = mix(col, foamColor*(1.0-dark*0.35), crest*0.55);
      float glint = pow(max(0.0, sin(vWorld.x*3.3 + time*2.1) * sin(vWorld.z*2.9 - time*1.6)), 10.0);
      col += glint * (0.05 + dark*0.35);
      gl_FragColor = vec4(col, 1.0);
      #include <fog_fragment>
    }`
});
const ocean = new THREE.Mesh(new THREE.PlaneGeometry(760, 190, 96, 40), oceanMat);
ocean.rotation.x = -Math.PI/2;
ocean.position.set(0, -0.16, -104);
scene.add(ocean);

/* 岸边泡沫带 */
const foamTexC = noiseCanvas('#ffffff', ['#dddddd','#ffffff'], 1500, 256);
const foamTex = new THREE.CanvasTexture(foamTexC);
foamTex.wrapS = foamTex.wrapT = THREE.RepeatWrapping;
const foamUni = { time:{ value:0 }, tex:{ value:foamTex }, dark:{ value:0 } };
const foamMat = new THREE.ShaderMaterial({
  uniforms: foamUni, transparent:true, depthWrite:false,
  vertexShader:`varying vec2 vUv; varying vec3 vW;
    void main(){ vUv = uv; vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz;
    gl_Position = projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`uniform float time; uniform sampler2D tex; uniform float dark;
    varying vec2 vUv; varying vec3 vW;
    void main(){
      float n1 = texture2D(tex, vec2(vUv.x*90.0, vUv.y*1.6 - time*0.14)).r;
      float n2 = texture2D(tex, vec2(vUv.x*60.0 + 0.37, vUv.y*2.6 - time*0.23)).r;
      float band = smoothstep(0.35, 0.95, sin(vW.z*1.15 - time*1.5)*0.5+0.5);
      float a = clamp((n1*0.65 + n2*0.55 - 0.42) * 1.6, 0.0, 1.0) * (0.35 + band*0.65);

function tube(a, b, r, mat, seg=10){
  const d = V3(b.x-a.x, b.y-a.y, b.z-a.z), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(V3(0,1,0), d.normalize());
  return m;

function makePalm(){
  const g = new THREE.Group();
  const lean = (Math.random()-0.5)*0.16, h = 2.6 + Math.random()*1.1;
  let p = V3(0,0,0);
  for (let i=0;i<3;i++){
    const q = V3(p.x + lean*0.5, p.y + h/3, p.z + lean*0.3);
    g.add(tube(p, q, 0.075 - i*0.012, M.trunk, 7)); p = q;
  }
  for (let i=0;i<7;i++){
    const a = (i/7)*Math.PI*2 + Math.random()*0.4;
    const frond = new THREE.Mesh(new THREE.ConeGeometry(0.055, 1.9, 5), M.palmTop);
    frond.position.set(p.x + Math.cos(a)*0.8, p.y + 0.28, p.z + Math.sin(a)*0.8);
    frond.rotation.set(Math.sin(a)*1.15, 0, -Math.cos(a)*1.15);
    frond.scale.z = 0.28; g.add(frond);
  }
  for (let i=0;i<2;i++){
    const nut = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), M.trunk);
    nut.position.set(p.x + (i?0.12:-0.1), p.y - 0.08, p.z + 0.05); g.add(nut);

}

const L1 = 0.32, L2 = 0.37;
function solveLeg(leg, target){
  const H = leg.hip, T = target;
  const dx = T.x - H.x, dy = T.y - H.y;
  let d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.005);
  const a = Math.atan2(dy, dx);
  const cosK = (L1*L1 + d*d - L2*L2) / (2 * L1 * d);
  const ka = a + Math.acos(THREE.MathUtils.clamp(cosK, -1, 1));
  const K = V3(H.x + Math.cos(ka)*L1, H.y + Math.sin(ka)*L1, H.z);
  const T2 = V3(H.x + Math.cos(a)*d, H.y + Math.sin(a)*d, T.z);
  aim(leg.thigh, H, K);
  aim(leg.shin, K, T2);
  leg.foot.position.copy(T2); leg.foot.position.y += 0.012;
}

const SC = { cols: 13, rows: 4, segX: 0.078, segZ: 0.046 };
const scarfPts = [], scarfPrev = [], scarfAnchors = [];
{
  for (let i=0;i<SC.cols;i++){
    for (let j=0;j<SC.rows;j++){
      const z = (j/(SC.rows-1) - 0.5) * SC.segZ * (SC.rows-1);
      const p = V3(0.13 - i*SC.segX, 1.45 - i*0.014, z * (1 + i*0.05));
      scarfPts.push(p); scarfPrev.push(p.clone());
      if (i === 0) scarfAnchors.push(p.clone());
    }
  }
}
const scarfGeo = new THREE.BufferGeometry();
{
  const idx = [];
  for (let i=0;i<SC.cols-1;i++) for (let j=0;j<SC.rows-1;j++){
    const a = i*SC.rows + j, b = a + SC.rows, c = a + 1, d = b + 1;
    idx.push(a, b, c, c, b, d);
  }
  scarfGeo.setIndex(idx);
  scarfGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SC.cols*SC.rows*3), 3));
}
const scarfMesh = new THREE.Mesh(scarfGeo, scarfMat);

chassis.add(scarfMesh);
const _sv = new THREE.Vector3();
function simulateScarf(dt, windX, t){
  const grav = -3.2, damp = 0.965;
  const step = Math.min(dt, 0.033);
  for (let n=0;n<scarfPts.length;n++){
    const p = scarfPts[n], pr = scarfPrev[n];
    const i = Math.floor(n / SC.rows);
    if (i === 0) continue;
    _sv.subVectors(p, pr).multiplyScalar(damp);
    pr.copy(p);
    const turb = Math.sin(t*7 + i*0.9 + (n%SC.rows)*1.7) * 0.55
               + Math.sin(t*13.7 + i*1.7) * 0.25;
    p.x += _sv.x + (windX * (0.55 + i/SC.cols*0.9)) * step*step*22;
    p.y += _sv.y + (grav + turb * (0.4 + windX*0.14)) * step*step;
    p.z += _sv.z + Math.cos(t*5.3 + i*1.1) * 0.35 * step*step * (1 + windX*0.2);
  }
  /* 锚点跟随脖子（带骑行起伏 bobY） */
  for (let j=0;j<SC.rows;j++){
    const a = scarfAnchors[j];
    scarfPts[j].set(a.x, a.y + rider.position.y, a.z);
    scarfPrev[j].copy(scarfPts[j]);
  }
  const satisfy = (ia, ib, rest) => {
    const a = scarfPts[ia], b = scarfPts[ib];
    _sv.subVectors(b, a);
    const d = _sv.length() || 0.0001, diff = (d - rest) / d;
    const iaPinned = ia < SC.rows, ibPinned = ib < SC.rows;
    if (!iaPinned && !ibPinned){ a.addScaledVector(_sv, 0.5*diff); b.addScaledVector(_sv, -0.5*diff); }
    else if (iaPinned && !ibPinned){ b.addScaledVector(_sv, -diff); }
    else if (!iaPinned && ibPinned){ a.addScaledVector(_sv, diff); }
  };
  for (let iter=0; iter<3; iter++){
    for (let i=0;i<SC.cols-1;i++) for (let j=0;j<SC.rows;j++)
      satisfy(i*SC.rows+j, (i+1)*SC.rows+j, SC.segX);
    for (let i=0;i<SC.cols;i++) for (let j=0;j<SC.rows-1;j++)
      satisfy(i*SC.rows+j, i*SC.rows+j+1, SC.segZ);
  }
  const attr = scarfGeo.getAttribute('position');
  for (let n=0;n<scarfPts.length;n++){
    attr.setXYZ(n, scarfPts[n].x, scarfPts[n].y, scarfPts[n].z);
  }
  attr.needsUpdate = true;
  scarfGeo.computeVertexNormals();
}

const catchAnims = [];
function spawnFish(){
  const act = fishes.filter(f=>f.active).length;
  if (act >= 6) return;
  let cand = fishes.filter(f=>!f.active);
  if (!cand.length) return;
  let f;
  const goldenOne = fishes[0];
  if (!goldenOne.active && Math.random() < 0.13) f = goldenOne;
  else { const normals = cand.filter(c=>!c.golden); if (!normals.length) return; f = normals[Math.floor(Math.random()*normals.length)]; }
  f.active = true; f.mesh.visible = true;
  f.lane = Math.floor(Math.random()*3);
  f.x = 50 + Math.random()*24;
  f.baseY = 0.5 + Math.random()*0.3;
  f.ph = Math.random()*7;
}
function catchFish(f){
  f.active = false;
  catchAnims.push({ mesh: f.mesh, t: 0, from: f.mesh.position.clone(), golden: f.golden });
  const gain = f.golden ? 3 : 1;
  stats.fish += gain; store.totalFish += gain; saveStore();
  stats.combo = (stats.comboTimer > 0) ? stats.combo + 1 : 1;
  stats.comboTimer = 2.6;
  stats.bestCombo = Math.max(stats.bestCombo, stats.combo);
  if (G.airborne || G.jumpY > 0.22){
    G.airCatches++;
    toast('🕊️ 空中抓鱼！', G.autopilot ? '自动驾驶空中得手' : `已空中抓鱼 ${G.airCatches} 条`);
  }
  if (f.golden) toast('✨ 抓到金鱼！+3', '稀有金鱼抵 3 条');
  if (G.autopilot){ G.autoCaught++; }
  burst(f.mesh.position, f.golden ? 0xffd94d : 0xbfeaff);
  AudioSys.catchBlip(f.golden);
  checkAchievements();
}
function updateFish(dt, v, t){
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0){ spawnFish(); G.spawnTimer = 0.9 + Math.random()*0.9; }
  for (const f of fishes){
    if (!f.active) continue;
    f.x -= v * dt;
    const y = f.baseY + Math.abs(Math.sin(t*3.1 + f.ph)) * 0.9;
    f.mesh.position.set(f.x, y, LANES[f.lane]);
    f.mesh.rotation.y = Math.PI;
    f.mesh.rotation.z = Math.cos(t*3.1 + f.ph) * 0.55;
    f.mesh.userData.tail.rotation.y = Math.sin(t*11 + f.ph) * 0.5;
    if (f.x < -14){ f.active = false; f.mesh.visible = false; continue; }
    if (Math.abs(f.x) < 0.88 && Math.abs(LANES[f.lane] - rig.position.z) < 0.9){
      if (Math.abs(y - (0.98 + G.jumpY)) < 0.85) catchFish(f);
    }
  }
  for (let i=catchAnims.length-1;i>=0;i--){
    const c = catchAnims[i]; c.t += dt / 0.30;
    const target = V3(0.68, 0.78 + G.jumpY, rig.position.z);
    c.mesh.position.lerpVectors(c.from, target, Math.min(c.t, 1));
    const s = 1 - Math.min(c.t, 1) * 0.75;
    c.mesh.scale.setScalar(s);
    if (c.t >= 1){ c.mesh.visible = false; c.mesh.scale.setScalar(1); catchAnims.splice(i, 1); }
  }
  for (const b of bursts){
    if (b.life <= 0) continue;
    b.life -= dt;
    b.v.y -= 7.5 * dt;
    b.m.position.addScaledVector(b.v, dt);
    b.m.material.opacity = Math.max(b.life, 0);
    if (b.life <= 0) b.m.visible = false;
  }
  if (stats.comboTimer > 0){
    stats.comboTimer -= dt;
    if (stats.comboTimer <= 0) stats.combo = 0;
  }
}

/* ================= 音频：实时合成音乐 + 音效 + 环境声 ================= */
let bellT = 0;
const AudioSys = {
  ctx:null, started:false, muted:false,
  cadenceRpm:0, dark:0,
  step:0, nextTime:0, timer:null,
  init(){
    if (this.started) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.ctx = ctx;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.connect(ctx.destination);
      this.master = ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(comp);
      this.musicFilter = ctx.createBiquadFilter();
      this.musicFilter.type = 'lowpass'; this.musicFilter.frequency.value = 3400;
      this.musicBus = ctx.createGain(); this.musicBus.gain.value = 0.42;
      this.musicBus.connect(this.musicFilter); this.musicFilter.connect(this.master);
      this.sfxBus = ctx.createGain(); this.sfxBus.gain.value = 0.9; this.sfxBus.connect(this.master);
      /* 延迟（给拨弦加空间感） */
      this.delay = ctx.createDelay(1); this.delay.delayTime.value = 0.27;
      const fb = ctx.createGain(); fb.gain.value = 0.34;
      const wet = ctx.createGain(); wet.gain.value = 0.20;
      this.delay.connect(fb); fb.connect(this.delay);
      this.delay.connect(wet); wet.connect(this.musicBus);
      /* 噪声源：海浪（棕色噪声）+ 风（白噪声） */
      const len = ctx.sampleRate * 2;
      const white = ctx.createBuffer(1, len, ctx.sampleRate);
      const wd = white.getChannelData(0);
      for (let i=0;i<len;i++) wd[i] = Math.random()*2 - 1;
      this.noiseBuf = white;
      const brown = ctx.createBuffer(1, len, ctx.sampleRate);
      const bd = brown.getChannelData(0);
      let last = 0;
      for (let i=0;i<len;i++){ const w = Math.random()*2 - 1; last = (last + 0.02*w) / 1.02; bd[i] = last * 3.2; }
      const oceanSrc = ctx.createBufferSource(); oceanSrc.buffer = brown; oceanSrc.loop = true;
      const oceanF = ctx.createBiquadFilter(); oceanF.type = 'lowpass'; oceanF.frequency.value = 420;
      this.oceanGain = ctx.createGain(); this.oceanGain.gain.value = 0.05;
      oceanSrc.connect(oceanF); oceanF.connect(this.oceanGain); this.oceanGain.connect(this.master);
      oceanSrc.start();
      const windSrc = ctx.createBufferSource(); windSrc.buffer = white; windSrc.loop = true;
      const windF = ctx.createBiquadFilter(); windF.type = 'bandpass'; windF.frequency.value = 640; windF.Q.value = 0.6;
      this.windGain = ctx.createGain(); this.windGain.gain.value = 0;
      windSrc.connect(windF); windF.connect(this.windGain); this.windGain.connect(this.master);
      windSrc.start();
      /* 音乐调度器 */
      this.nextTime = ctx.currentTime + 0.06;
      this.timer = setInterval(()=> this.schedule(), 90);
      this.started = true;
    } catch(e) { /* 无音频环境则静默 */ }
  },
  bpm(){ return THREE.MathUtils.clamp(58 + this.cadenceRpm * 1.15, 58, 158); },
  schedule(){
    if (!this.ctx) return;
    const stepDur = 60 / this.bpm() / 2;
    while (this.nextTime < this.ctx.currentTime + 0.20){
      this.playStep(this.step, this.nextTime, stepDur);
      this.nextTime += stepDur;
      this.step++;
    }
  },
  tone({ type='sine', f0=440, f1=null, t=0, dur=0.2, gain=0.2, dest=null, delaySend=0 }){
    const ctx = this.ctx; if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== null) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxBus);
    if (delaySend > 0){ const dg = ctx.createGain(); dg.gain.value = delaySend; g.connect(dg); dg.connect(this.delay); }
    o.start(t); o.stop(t + dur + 0.05);
  },
  noiseHit({ t=0, dur=0.05, gain=0.12, freq=7000, type='highpass' }){
    const ctx = this.ctx; if (!ctx) return;
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.9 + Math.random()*0.2;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.musicBus);
    src.start(t); src.stop(t + dur + 0.05);
  },
  playStep(step, t, stepDur){
    const CHORDS = [
      { root:45, tones:[57,60,64,69] },  // Am
      { root:41, tones:[53,57,60,65] },  // F
      { root:48, tones:[55,60,64,67] },  // C
      { root:43, tones:[55,59,62,67] },  // G
    ];
    const chord = CHORDS[Math.floor(step/16) % 4];
    const s16 = step % 16;
    const mf = m => 440 * Math.pow(2, (m - 69)/12);
    if (s16 % 4 === 0)  // 鼓点
      this.tone({ type:'sine', f0:130, f1:42, t, dur:0.13, gain:0.50, dest:this.musicBus });
    if (s16 % 4 === 2 || s16 === 15)  // 踩镲
      this.noiseHit({ t, dur:0.04, gain: s16 === 15 ? 0.06 : 0.11 });
    if ([0,3,6,8,11,14].includes(s16)){  // 贝斯
      const lift = (s16 === 6 || s16 === 14) ? 7 : (s16 === 11 ? 12 : 0);
      this.tone({ type:'sawtooth', f0:mf(chord.root + lift), t, dur:stepDur*0.92, gain:0.16, dest:this.musicBus });
    }
    if (s16 % 2 === 1 && Math.random() < 0.52){  // 拨弦旋律（随机游走）
      this._walk = THREE.MathUtils.clamp((this._walk ?? 1) + (Math.random()<0.5?-1:1) * (Math.random()<0.2?2:1), 0, chord.tones.length-1);
      this.tone({ type:'triangle', f0:mf(chord.tones[this._walk] + 12), t, dur:0.22, gain:0.15, dest:this.musicBus, delaySend:0.7 });
    }
  },
  update(speedKmh, t){
    if (!this.started) return;
    const tc = this.ctx.currentTime;
    this.windGain.gain.setTargetAtTime(THREE.MathUtils.clamp(speedKmh/42, 0, 1) * 0.13, tc, 0.2);
    this.oceanGain.gain.setTargetAtTime(0.045 + 0.02 * (0.5 + 0.5*Math.sin(t*0.45)) + this.dark*0.012, tc, 0.3);
    this.musicFilter.frequency.setTargetAtTime(this.dark > 0.6 ? 950 : 3400, tc, 0.8);
  },
  bell(){
    if (!this.started) return;
    const t = this.ctx.currentTime;
    for (const [f, g] of [[2210, 0.20], [2960, 0.11], [1560, 0.05]])
      this.tone({ type:'sine', f0:f, t, dur:0.8, gain:g });
  },
  catchBlip(golden){
    if (!this.started) return;
    const t = this.ctx.currentTime;
    this.tone({ type:'square', f0:520, f1:940, t, dur:0.12, gain:0.12 });
    if (golden){
      this.tone({ type:'square', f0:780, f1:1240, t:t+0.07, dur:0.16, gain:0.12 });
      this.tone({ type:'sine', f0:1560, t:t+0.14, dur:0.3, gain:0.10 });
    }
  },
  whoosh(){
    if (!this.started) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(380, t);
    f.frequency.exponentialRampToValueAtTime(1900, t + 0.32);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    src.connect(f); f.connect(g); g.connect(this.sfxBus);
    src.start(t); src.stop(t + 0.42);
  },
  thud(){
    if (!this.started) return;
    this.tone({ type:'sine', f0:95, f1:48, t:this.ctx.currentTime, dur:0.11, gain:0.28 });
  },
  tick(){
    if (!this.started) return;
    this.tone({ type:'sine', f0:1750, t:this.ctx.currentTime, dur:0.035, gain:0.06 });
  },
  fanfare(){
    if (!this.started) return;
    const t = this.ctx.currentTime;
    [523, 659, 784, 1047].forEach((f, i)=>
      this.tone({ type:'triangle', f0:f, t:t + i*0.09, dur:0.24, gain:0.16 }));
    this.tone({ type:'triangle', f0:1319, t:t + 0.38, dur:0.42, gain:0.14 });
  },
};

const CINE_SHOTS = [
  { dur:6, pos:(s,o)=>o.set(4.6 - s*0.7, 0.65, 3.6),        look:(s,o)=>o.set(0.2, 1.15, rig.position.z*0.7) },
  { dur:6, pos:(s,o)=>o.set(-3.6, 4.6 - s*1.6, 4.4),        look:(s,o)=>o.set(0, 0.9, 0) },
  { dur:6, pos:(s,o)=>o.set(-1.8 + s*1.4, 1.25, 5.6),       look:(s,o)=>o.set(0.2, 1.1, rig.position.z*0.8) },
  { dur:6, pos:(s,o)=>o.set(-2.7, 1.3, -2.5),               look:(s,o)=>o.set(0.8, 1.0, rig.position.z*0.5) },
  { dur:5, pos:(s,o)=>o.set(0.6, 6.8, 1.0),                 look:(s,o)=>o.set(0, 0.7, rig.position.z) },
];
let cineIdx = 0, cineT = 0;
const _hw = new THREE.Vector3(), _hq = new THREE.Quaternion(), _fwd = new THREE.Vector3(), _tmp = new THREE.Vector3();
function updateCamera(dt){
  if (viewName === 'free'){ controls.update(); camPos.copy(camera.position); return; }
  if (viewName === 'pov'){
    headGrp.getWorldPosition(_hw); headGrp.getWorldQuaternion(_hq);
    _fwd.set(1, 0, 0).applyQuaternion(_hq);
    _tmp.copy(_hw); _tmp.y += 0.055; _tmp.addScaledVector(_fwd, -0.03);
    const k = 1 - Math.exp(-dt * 30);
    camera.position.lerp(_tmp, k);
    _tmp.copy(_hw).addScaledVector(_fwd, 5); _tmp.y -= 0.35;
    camLook.lerp(_tmp, k); camera.lookAt(camLook);
    camPos.copy(camera.position);
    return;
  }
  let tp, tl, k = 1 - Math.exp(-dt * 3.4);
  if (viewName === 'side'){
    tp = _tmp.set(0.6, 1.5, 6.3); tl = V3(0, 1.05, rig.position.z * 0.55);
  } else if (viewName === 'chase'){
    tp = _tmp.set(-5.3, 2.1, rig.position.z * 0.65 + 1.9); tl = V3(2.4, 0.9, rig.position.z);
  } else { // cine
    cineT += dt;
    const shot = CINE_SHOTS[cineIdx];
    if (cineT >= shot.dur){ cineT = 0; cineIdx = (cineIdx + 1) % CINE_SHOTS.length; }
    const s = cineT / CINE_SHOTS[cineIdx].dur;
    tp = CINE_SHOTS[cineIdx].pos(s, new THREE.Vector3());
    tl = CINE_SHOTS[cineIdx].look(s, new THREE.Vector3());
    k = 1 - Math.exp(-dt * 2.1);
  }
  camPos.lerp(tp, k); camLook.lerp(tl, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
}

const phaseNameEl = document.getElementById('phaseName');
let lastPhaseName = '';
const _nightCloud = new THREE.Color(0x2c3a55), _duskCloud = new THREE.Color(0xffd9c0);
function applyCycle(dt){
  cycleT = (cycleT + dt / CYCLE_LEN) % 1;
  cyc = sampleCycle(cycleT);
  skyUni.topColor.value.copy(cyc.top);
  skyUni.horizonColor.value.copy(cyc.hor);
  scene.fog.color.copy(cyc.fog);
  const elR = THREE.MathUtils.degToRad(cyc.sunEl), azR = THREE.MathUtils.degToRad(cyc.sunAz);
  const sunDir = V3(Math.cos(elR)*Math.cos(azR), Math.sin(elR), Math.cos(elR)*Math.sin(azR));
  sunDisc.position.copy(sunDir).multiplyScalar(395);
  sunDisc.material.color.setHex(0xffdf8a).lerp(new THREE.Color(0xff8f4d),
    THREE.MathUtils.clamp(1 - cyc.sunEl/16, 0, 1));
  const moonEl = THREE.MathUtils.clamp(-cyc.sunEl*0.85 + 14, 3, 52);
  const mElR = THREE.MathUtils.degToRad(moonEl), mAzR = THREE.MathUtils.degToRad(cyc.sunAz + 58);
  const moonDir = V3(Math.cos(mElR)*Math.cos(mAzR), Math.sin(mElR), Math.cos(mElR)*Math.sin(mAzR));
  moonDisc.position.copy(moonDir).multiplyScalar(392);
  moonGlow.position.copy(moonDir).multiplyScalar(390);
  moonGlow.material.opacity = cyc.dark * 0.20;
  sun.position.copy(cyc.sunEl > -1 ? sunDir : moonDir).multiplyScalar(120);
  sun.color.copy(cyc.sunC); sun.intensity = cyc.sunI;
  hemi.intensity = cyc.hemi; amb.intensity = cyc.amb;
  starMat.opacity = cyc.stars;
  renderer.toneMappingExposure = cyc.exp;
  oceanUni.dark.value = cyc.dark;
  foamUni.dark.value = cyc.dark;
  headlight.intensity = cyc.dark * 95;
  lampLensMat.emissiveIntensity = 0.15 + cyc.dark * 2.2;
  M.lampGlow.emissiveIntensity = cyc.dark * 2.6;
  for (const h of houses) h.userData.winMat.emissiveIntensity = cyc.dark * 1.5;
  cloudMat.color.copy(_duskCloud).lerp(_nightCloud, cyc.dark);
  AudioSys.dark = cyc.dark;
  if (cyc.name !== lastPhaseName){ lastPhaseName = cyc.name; phaseNameEl.textContent = cyc.name; }
}

const Quality = {
  mode:'auto', tier:0, ema:60, evalT:0, upStreak:0,
  apply(tier){
    this.tier = tier;
    const dpr = devicePixelRatio || 1;
    if (tier === 0){
      renderer.setPixelRatio(Math.min(dpr, 2));
      sun.castShadow = true; this._shadow(2048);
      for (const s of streaks) s.visible = true;
      for (const c of clouds) c.visible = true;
    } else if (tier === 1){
      renderer.setPixelRatio(Math.min(dpr, 1.5));
      sun.castShadow = true; this._shadow(1024);
      for (const s of streaks) s.visible = true;
      for (const c of clouds) c.visible = true;
    } else {
      renderer.setPixelRatio(1);
      sun.castShadow = false;
      for (const s of streaks) s.visible = false;
      clouds.forEach((c, i)=> c.visible = i % 2 === 0);
    }
  },
  _shadow(size){
    if (sun.shadow.mapSize.x !== size){
      sun.shadow.mapSize.set(size, size);
      if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
    }
  },
  update(dt){
    if (dt > 0) this.ema = this.ema * 0.95 + (1/Math.max(dt, 0.001)) * 0.05;
    if (this.mode !== 'auto') return;
    this.evalT += dt;
    if (this.evalT < 2.5) return;
    this.evalT = 0;
    if (this.ema < 45 && this.tier < 2){ this.apply(this.tier + 1); this.upStreak = 0; }
    else if (this.ema > 57 && this.tier > 0){
      if (++this.upStreak >= 2){ this.apply(this.tier - 1); this.upStreak = 0; }
    } else this.upStreak = 0;
  }
};
const qualityBtn = document.getElementById('qualityBtn');
const Q_MODES = [['auto','画质：自动'], ['0','画质：高'], ['1','画质：中'], ['2','画质：低']];
let qModeIdx = 0;
qualityBtn.addEventListener('click', ()=>{
  qModeIdx = (qModeIdx + 1) % Q_MODES.length;
  const [m, label] = Q_MODES[qModeIdx];
  qualityBtn.textContent = label;
  Quality.mode = m;
  if (m !== 'auto') Quality.apply(parseInt(m));
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let T = 0, achTimer = 0, saveTimer = 0;
const autoBadge = document.getElementById('autoBadge');
const kmhEl = document.getElementById('kmh'), rpmEl = document.getElementById('rpm'),
      odoEl = document.getElementById('odo'), fishEl = document.getElementById('fishCount'),
      comboEl = document.getElementById('combo');
let loaderHidden = false;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;
  const t = T;

  applyCycle(dt);
  oceanUni.time.value = t;
  foamUni.time.value = t;
  updateBreakers(dt, t);
  for (const c of clouds){ c.position.x += dt * 0.55; if (c.position.x > 190) c.position.x = -190; }
  for (const b of birds){
    const u = b.userData, a = t * u.sp + u.off;
    b.position.set(u.cx + Math.cos(a)*u.r, u.h + Math.sin(t*0.9 + u.off)*0.8, -14 + Math.sin(a)*u.r*0.6);
    b.rotation.y = -a - Math.PI/2;
    const flap = Math.sin(t*7 + u.off) * 0.55;
    u.pl.rotation.z = flap; u.pr.rotation.z = -flap;
    b.visible = cyc.dark < 0.55;
  }
  for (const f of floaters){
    f.position.y = 0.02 + Math.sin(t*0.9 + f.userData.ph) * 0.07;
    f.rotation.z = Math.sin(t*0.7 + f.userData.ph) * 0.05;
    f.rotation.x = Math.cos(t*0.8 + f.userData.ph) * 0.04;
  }

  let v = 0, crankW = 0;
  if (G.started){
    /* 速度控制 */
    if (keys['KeyW'] || keys['ArrowUp'])   { G.targetSpeed = Math.min(G.targetSpeed + 16*dt, 42); noteInput(); }
    if (keys['KeyS'] || keys['ArrowDown']) { G.targetSpeed = Math.max(G.targetSpeed - 18*dt, 0);  noteInput(); }
    /* 自动驾驶 */
    G.idleTime += dt;
    if (G.idleTime > 5 && !G.autopilot) G.autopilot = true;
    if (G.autopilot){
      let best = null;
      for (const f of fishes)
        if (f.active && f.x > 1.5 && f.x < 70 && (!best || f.x < best.x)) best = f;
      const want = best ? best.lane : 1;
      G._laneT = (G._laneT || 0) - dt;
      if (G.laneIdx !== want && G._laneT <= 0){
        G.laneIdx += Math.sign(want - G.laneIdx); G._laneT = 0.4;
      }
      G.targetSpeed = 17;
    }
    autoBadge.style.display = G.autopilot ? 'block' : 'none';
    const accel = G.speedKmh < G.targetSpeed ? 9 : 15;
    G.speedKmh += THREE.MathUtils.clamp(G.targetSpeed - G.speedKmh, -accel*dt, accel*dt);
    G.maxSpeed = Math.max(G.maxSpeed, G.speedKmh);
    v = G.speedKmh / 3.6;
    G.odo += v * dt; store.totalDist += v * dt;
    if (cyc.dark > 0.75) G.nightDist += v * dt;
    /* 车道平滑 */
    rig.position.z += (LANES[G.laneIdx] - rig.position.z) * (1 - Math.exp(-dt * 5.5));
    /* 跳跃 */
    if (G.airborne){
      G.vy -= 24 * dt; G.jumpY += G.vy * dt;
      if (G.jumpY <= 0){ G.jumpY = 0; G.airborne = false; G.landT = 1; AudioSys.thud(); }
    }
    rig.position.y = G.jumpY;
    G.landT = Math.max(0, G.landT - dt * 5);
    /* 展翅翘头 */
    G.wingTimer = Math.max(0, G.wingTimer - dt);
    const wingOn = keys['KeyT'] || G.wingTimer > 0;
    const wTarget = wingOn ? 1 : 0;
    G.wheelie += (wTarget - G.wheelie) * (1 - Math.exp(-dt * 3.6));
    G.wingSpread += (wTarget - G.wingSpread) * (1 - Math.exp(-dt * 4.5));
    wheelieGrp.rotation.z = G.wheelie * 0.44 * (G.airborne ? 0.35 : 1);
    if (G.wheelie > 0.72 && !G.airborne) G.wheelieCont += dt;
    else if (G.wheelie < 0.3) G.wheelieCont = 0;
    /* 踩踏与车轮 */
    const wheelW = v / WHEEL_R;
    crankW = wheelW * 0.42;
    G.crankAngle += crankW * dt;
    wheelR.rotation.z -= wheelW * dt;
    wheelF.rotation.z -= wheelW * dt;
    crank.rotation.z = -G.crankAngle;
    const th = -G.crankAngle;
    for (const [leg, s] of [[legNear, 1], [legFar, -1]]){
      solveLeg(leg, V3(
        BB.x - Math.sin(th) * CRANK_L * s,
        BB.y + Math.cos(th) * CRANK_L * s,
        s * 0.10));
    }
    /* 姿态 */
    const bob = Math.sin(G.crankAngle * 2) * 0.013 * (v > 0.3 ? 1 : 0.25);
    rider.position.y = bob - G.landT * 0.03;
    rider.rotation.z = -0.04 - G.speedKmh * 0.0016 + G.wheelie * 0.15;
    rider.position.x = -G.wheelie * 0.045;
    wingNear.rotation.x = Math.sin(G.crankAngle * 2) * 0.08 - G.wingSpread * 1.02;
    wingFar.rotation.x  = -Math.sin(G.crankAngle * 2) * 0.08 + G.wingSpread * 1.02;
    tail.rotation.y = Math.sin(t * 2.2) * 0.08;
    const full = Math.min(stats.fish, 12) / 12;
    pouch.scale.set(1.6, 0.60 + full * 0.5, 0.60 + full * 0.35);
    pouch.position.y = -0.088 - full * 0.03;
    updateFish(dt, v, t);
    /* 世界滚动 */
    for (const m of movers){ m.position.x -= v * dt; if (m.position.x < -95) m.position.x += 190; }
    /* 风线 */
    streakMat.opacity = THREE.MathUtils.clamp((G.speedKmh - 13) / 26, 0, 0.5);
    if (streakMat.opacity > 0.01){
      for (const s of streaks){
        s.position.x -= (v + 6) * dt * 1.6;
        if (s.position.x < -9){ s.position.x = 9; s.position.y = 0.3 + Math.random()*2.4; s.position.z = (Math.random()-0.5)*4.5; }
        s.scale.x = 0.6 + G.speedKmh * 0.05;
      }
    }
    /* HUD */
    kmhEl.textContent = G.speedKmh.toFixed(1);
    rpmEl.textContent = Math.round(crankW * 60 / (Math.PI * 2));
    odoEl.textContent = (G.odo / 1000).toFixed(2);
    fishEl.textContent = stats.fish;
    comboEl.textContent = stats.combo >= 2 ? `连抓 ×${stats.combo}` : '';
    AudioSys.cadenceRpm = crankW * 60 / (Math.PI * 2);
    AudioSys.update(G.speedKmh, t);
    achTimer += dt;
    if (achTimer > 1){ achTimer = 0; checkAchievements(); }
    saveTimer += dt;
    if (saveTimer > 4){ saveTimer = 0; saveStore(); }
  } else {
    /* 待机：呼吸 + 微风围巾 */
    rider.position.y = Math.sin(t * 1.6) * 0.006;
    wingNear.rotation.x = Math.sin(t * 1.6) * 0.03;
    wingFar.rotation.x = -Math.sin(t * 1.6) * 0.03;
    autoBadge.style.display = 'none';
  }
  /* 头部 / 铃铛 */
  if (bellT > 0) bellT = Math.max(0, bellT - dt * 2.0);
  headGrp.rotation.y = Math.sin(bellT * 42) * 0.22 * bellT + Math.sin(t * 0.7) * 0.06;
  headGrp.rotation.z = Math.sin(t * 1.25) * 0.045;
  beakGrp.rotation.z = Math.sin(t * 1.7) * 0.03 - G.wingSpread * 0.06;
  /* 围巾布料 */
  simulateScarf(dt, 1.15 + v * 0.85, t);
  updateCamera(dt);
  Quality.update(dt);
  renderer.render(scene, camera);
  if (!loaderHidden){
    loaderHidden = true;
    const l = document.getElementById('loader');
    l.style.opacity = '0'; setTimeout(()=> l.remove(), 750);
  }
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('visibilitychange', ()=>{ if (document.hidden) saveStore(); });
</script>
</body>
</html>
