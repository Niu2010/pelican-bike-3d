<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · 3D</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a0f2e;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
  canvas{display:block}
  #hud{position:fixed;left:20px;top:18px;pointer-events:none}
  #hud h1{margin:0;font-size:26px;letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
  #hud p{margin:4px 0 0;opacity:.8;font-size:13px}
  #panel{position:fixed;right:18px;bottom:18px;background:rgba(20,12,40,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px 16px;width:250px;font-size:13px}
  #panel label{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
  #panel input[type=range]{width:120px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .btns button{flex:1 1 45%;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 4px;cursor:pointer;font-size:12px}
  .btns button.on,.btns button:hover{background:#ff8a3d;border-color:#ff8a3d}
  #speedo{position:fixed;left:20px;bottom:18px;font-variant-numeric:tabular-nums;font-size:13px;opacity:.85;line-height:1.6}
  #speedo b{font-size:30px;font-weight:700}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a0f2e;font-size:18px;transition:opacity .8s;z-index:9}
</style>
</head>
<body>
<div id="loading">鹈鹕正在打气…</div>
<div id="hud">
  <h1>🐦 鹈鹕骑车去海边</h1>
  <p>拖动旋转 · 滚轮缩放 · 空格 / 点击按铃</p>
</div>
<div id="speedo"><b id="kmh">0</b> km/h<br>里程 <span id="dist">0.00</span> km</div>
<div id="panel">
  <label>车速 <input id="speed" type="range" min="0" max="3" step="0.05" value="1"></label>
  <label>时间 <input id="tod" type="range" min="0" max="1" step="0.01" value="0.35"></label>
  <label>辉光 <input id="bloom" type="range" min="0" max="1.5" step="0.05" value="0.45"></label>
  <div class="btns" id="cams">
    <button data-cam="orbit" class="on">环绕</button>
    <button data-cam="side">侧面跟拍</button>
    <button data-cam="front">正面特写</button>
    <button data-cam="drone">航拍</button>
  </div>
  <div class="btns">
    <button id="bell">🔔 按铃</button>
    <button id="snd">🔊 声音</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- 基础 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffb27a, 18, 90);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 500);
camera.position.set(3.2, 1.8, 4.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.1, 0.9, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 1.5; controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.49;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.6, 0.85);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ---------- 天空 ----------
const skyUniforms = {
  top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, bottom: { value: new THREE.Color() },
  sunDir: { value: new THREE.Vector3() }, sunColor: { value: new THREE.Color() }
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `uniform vec3 top,mid,bottom,sunDir,sunColor; varying vec3 vP;
    void main(){ float h = vP.y;
      vec3 c = h>0.0 ? mix(mid, top, pow(clamp(h*2.2,0.0,1.0),0.7)) : mix(mid, bottom, clamp(-h*4.0,0.0,1.0));
      float s = max(dot(vP, normalize(sunDir)),0.0);
      c += sunColor * (pow(s, 900.0)*6.0 + pow(s, 12.0)*0.35);
      gl_FragColor = vec4(c,1.0); }`
}));
scene.add(sky);

// 星星（夜晚出现）
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 1500; i++) {
  const v = new THREE.Vector3().randomDirection(); if (v.y < 0.05) v.y = Math.abs(v.y) + 0.05;
  v.normalize().multiplyScalar(280); starPos.push(v.x, v.y, v.z);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.9, transparent: true, opacity: 0, fog: false });
scene.add(new THREE.Points(starGeo, starMat));

// ---------- 灯光 ----------
const hemi = new THREE.HemisphereLight(0xffd6b0, 0x3a4a6a, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc28a, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 60 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
const headLamp = new THREE.SpotLight(0xfff2c0, 0, 14, 0.45, 0.6, 1.2);
headLamp.position.set(0.62, 0.95, 0); headLamp.target.position.set(5, 0, 0);
scene.add(headLamp, headLamp.target);

// ---------- 材质 ----------
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, ...o });
const mat = {
  frame: M(0xe8364f, { metalness: 0.5, roughness: 0.3 }),
  chrome: M(0xdddddd, { metalness: 1, roughness: 0.18 }),
  tire: M(0x1a1a1a, { roughness: 0.9 }),
  dark: M(0x2b2b2b, { roughness: 0.5 }),
  feather: M(0xfbfaf6, { roughness: 0.85 }),
  featherShade: M(0xd9d6cc, { roughness: 0.9 }),
  wingTip: M(0x2e2e33, { roughness: 0.8 }),
  beak: M(0xf6a93b, { roughness: 0.45 }),
  pouch: M(0xf08a2c, { roughness: 0.5, transparent: true, opacity: 0.93 }),
  leg: M(0xf29b3a, { roughness: 0.6 }),
  eye: M(0x111111, { roughness: 0.1, metalness: 0.2 }),
  crest: M(0xf7d878, { roughness: 0.7 }),
  lampGlow: new THREE.MeshBasicMaterial({ color: 0xfff1b8 })
};

// 工具：两点之间放一根圆柱
const UP = new THREE.Vector3(0, 1, 0);
function rod(a, b, r, m, seg = 12) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, seg), m);
  mesh.castShadow = true;
  placeRod(mesh, a, b); return mesh;
}
function placeRod(mesh, a, b) {
  const d = new THREE.Vector3().subVectors(b, a);
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.scale.set(1, d.length(), 1);
  mesh.quaternion.setFromUnitVectors(UP, d.normalize());
}
const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);

// ---------- 自行车 ----------
const rig = new THREE.Group(); scene.add(rig);
const bike = new THREE.Group(); rig.add(bike);
const R = 0.36, REAR = V(-0.56, R), FRONT = V(0.58, R), BB = V(0, 0.3);
const SEAT = V(-0.2, 0.86), HEAD_T = V(0.44, 0.88), HEAD_B = V(0.48, 0.74);

function makeWheel() {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.TorusGeometry(R, 0.035, 14, 48), mat.tire); tire.castShadow = true;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R - 0.035, 0.012, 8, 48), mat.chrome);
  g.add(tire, rim);
  const spokes = new THREE.Group();
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * Math.PI * 2, z = (i % 2 ? 0.02 : -0.02);
    spokes.add(rod(V(0, 0, z * 1.5), V(Math.cos(a) * (R - 0.04), Math.sin(a) * (R - 0.04), 0), 0.003, mat.chrome, 4));
  }
  g.add(spokes);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.09, 16), mat.chrome);
  hub.rotation.x = Math.PI / 2; g.add(hub);
  // 反光片
  const refl = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.005), new THREE.MeshStandardMaterial({ color: 0xff7a00, emissive: 0xff5500, emissiveIntensity: 0.6 }));
  refl.position.set(0, R * 0.6, 0.03); g.add(refl);
  return g;
}
const wheelR = makeWheel(); wheelR.position.copy(REAR); bike.add(wheelR);
const wheelF = makeWheel(); wheelF.position.copy(FRONT); bike.add(wheelF);

// 车架（双侧后叉）
for (const z of [-0.05, 0.05]) {
  bike.add(rod(V(REAR.x, REAR.y, z), V(BB.x, BB.y, z * 0.4), 0.014, mat.frame));
  bike.add(rod(V(REAR.x, REAR.y, z), V(SEAT.x, SEAT.y - 0.06, z * 0.3), 0.012, mat.frame));
  bike.add(rod(V(HEAD_B.x, HEAD_B.y, z * 0.5), V(FRONT.x, FRONT.y, z), 0.014, mat.chrome));
}
bike.add(rod(BB, V(SEAT.x, SEAT.y - 0.05), 0.022, mat.frame));
bike.add(rod(V(SEAT.x + 0.01, SEAT.y - 0.07), HEAD_T, 0.02, mat.frame));
bike.add(rod(BB, HEAD_B, 0.025, mat.frame));
bike.add(rod(HEAD_B, HEAD_T, 0.028, mat.frame));
// 座杆与车座
bike.add(rod(V(SEAT.x, SEAT.y - 0.06), V(SEAT.x - 0.015, SEAT.y + 0.04), 0.012, mat.chrome));
const saddle = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 10), mat.dark);
saddle.scale.set(1.3, 0.28, 0.6); saddle.position.set(SEAT.x - 0.02, SEAT.y + 0.06, 0); saddle.castShadow = true; bike.add(saddle);
// 车把
const STEM = V(HEAD_T.x - 0.01, HEAD_T.y + 0.1);
bike.add(rod(HEAD_T, STEM, 0.014, mat.chrome));
const barCurve = new THREE.CatmullRomCurve3([V(STEM.x - 0.08, STEM.y + 0.02, -0.26), V(STEM.x, STEM.y, -0.2), V(STEM.x + 0.02, STEM.y, 0), V(STEM.x, STEM.y, 0.2), V(STEM.x - 0.08, STEM.y + 0.02, 0.26)]);
const bar = new THREE.Mesh(new THREE.TubeGeometry(barCurve, 30, 0.012, 8), mat.chrome); bar.castShadow = true; bike.add(bar);
for (const z of [-0.24, 0.24]) {
  const grip = rod(V(STEM.x - 0.06, STEM.y + 0.015, z), V(STEM.x - 0.1, STEM.y + 0.025, z * 1.12), 0.018, mat.dark); bike.add(grip);
}
// 车铃
const bellMesh = new THREE.Mesh(new THREE.SphereGeometry(0.025, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat.chrome);
bellMesh.position.set(STEM.x + 0.01, STEM.y + 0.015, 0.13); bike.add(bellMesh);
// 车灯
const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.06, 16), mat.dark);
lamp.rotation.z = Math.PI / 2; lamp.position.set(HEAD_T.x + 0.06, HEAD_T.y - 0.02, 0); bike.add(lamp);
const lampFace = new THREE.Mesh(new THREE.CircleGeometry(0.036, 16), mat.lampGlow);
lampFace.rotation.y = Math.PI / 2; lampFace.position.set(HEAD_T.x + 0.092, HEAD_T.y - 0.02, 0); bike.add(lampFace);
// 车篮（装着鱼）
const basket = new THREE.Group();
const basketMat = M(0xa8743f, { roughness: 0.95, wireframe: false });
const bBox = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.14, 0.26), basketMat);
bBox.material = new THREE.MeshStandardMaterial({ color: 0xb07a42, roughness: 1, transparent: true, opacity: 0.95 });
basket.add(bBox);
const wire = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.22, 0.14, 0.26, 4, 2, 4)), new THREE.LineBasicMaterial({ color: 0x6b4520 }));
basket.add(wire);
const fishMat = M(0x8fb8d8, { metalness: 0.6, roughness: 0.3 });
for (let i = 0; i < 3; i++) {
  const fish = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), fishMat);
  fish.scale.set(1.6, 0.6, 0.5); fish.position.set(-0.03 + i * 0.03, 0.08, -0.07 + i * 0.07); fish.rotation.z = 0.6 - i * 0.4;
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.05, 4), fishMat); tail.rotation.z = Math.PI / 2; tail.position.x = -0.09; fish.add(tail);
  basket.add(fish);
}
basket.position.set(HEAD_T.x + 0.12, HEAD_T.y - 0.07, 0); basket.traverse(o => o.castShadow = true); bike.add(basket);
// 挡泥板
for (const [c, a0] of [[REAR, Math.PI * 0.1], [FRONT, Math.PI * 0.05]]) {
  const fender = new THREE.Mesh(new THREE.TorusGeometry(R + 0.05, 0.022, 6, 32, Math.PI * 0.85), mat.frame);
  fender.position.copy(c); fender.rotation.z = a0; fender.scale.z = 2.2; bike.add(fender);
}

// 牙盘 + 链条
const crank = new THREE.Group(); crank.position.copy(BB); bike.add(crank);
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.012, 8, 32), mat.chrome); ring.position.z = 0.06; crank.add(ring);
const ringSpokes = rod(V(-0.08, 0, 0.06), V(0.08, 0, 0.06), 0.008, mat.chrome); crank.add(ringSpokes);
const CRANK_L = 0.17;
const armL = rod(V(0, 0, 0.08), V(CRANK_L, 0, 0.08), 0.012, mat.chrome); crank.add(armL);
const armR = rod(V(0, 0, -0.08), V(-CRANK_L, 0, -0.08), 0.012, mat.chrome); crank.add(armR);
const pedalGeo = new THREE.BoxGeometry(0.09, 0.02, 0.07);
const pedalN = new THREE.Mesh(pedalGeo, mat.dark), pedalF = new THREE.Mesh(pedalGeo, mat.dark);
bike.add(pedalN, pedalF);
const chainCurve = new THREE.CatmullRomCurve3([V(0, 0.39, 0.06), V(-0.28, 0.4, 0.06), V(REAR.x, REAR.y + 0.05, 0.06), V(REAR.x - 0.05, REAR.y, 0.06), V(REAR.x, REAR.y - 0.05, 0.06), V(-0.28, 0.28, 0.06), V(0, 0.21, 0.06), V(0.09, 0.3, 0.06)], true);
bike.add(new THREE.Mesh(new THREE.TubeGeometry(chainCurve, 80, 0.006, 4, true), mat.dark));

// ---------- 鹈鹕 ----------
const bird = new THREE.Group(); rig.add(bird);
const body = new THREE.Group(); bird.add(body);
const torso = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 20), mat.feather);
torso.scale.set(1.45, 0.95, 0.95); torso.position.set(-0.1, 1.17, 0); torso.rotation.z = 0.25; torso.castShadow = true;
body.add(torso);
const belly = new THREE.Mesh(new THREE.SphereGeometry(0.25, 24, 16), mat.featherShade);
belly.scale.set(1.3, 0.8, 0.85); belly.position.set(-0.06, 1.06, 0); belly.rotation.z = 0.25; body.add(belly);
// 尾巴
const tail = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.32, 12), mat.featherShade);
tail.rotation.z = Math.PI / 2 + 0.35; tail.scale.z = 0.5; tail.position.set(-0.52, 1.02, 0); tail.castShadow = true; body.add(tail);

// 脖子（S 形）
const neckGroup = new THREE.Group(); body.add(neckGroup);
const neckCurve = new THREE.CatmullRomCurve3([V(0.18, 1.28), V(0.3, 1.45), V(0.22, 1.62), V(0.27, 1.8), V(0.36, 1.88)]);
const neckGeo = new THREE.TubeGeometry(neckCurve, 40, 0.075, 16);
// 脖子逐渐变细
{
  const p = neckGeo.attributes.position, tmp = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    const u = Math.floor(i / 17) / 40; const c = neckCurve.getPoint(u);
    tmp.fromBufferAttribute(p, i).sub(c).multiplyScalar(1.15 - u * 0.45).add(c); p.setXYZ(i, tmp.x, tmp.y, tmp.z);
  }
  neckGeo.computeVertexNormals();
}
const neck = new THREE.Mesh(neckGeo, mat.feather); neck.castShadow = true; neckGroup.add(neck);

// 头
const head = new THREE.Group(); head.position.set(0.38, 1.9, 0); neckGroup.add(head);
const skull = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), mat.feather);
skull.scale.set(1.25, 1, 0.9); skull.castShadow = true; head.add(skull);
const crest = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), mat.crest);
crest.scale.set(1.6, 0.7, 0.8); crest.position.set(-0.07, 0.07, 0); head.add(crest);
for (const z of [-0.07, 0.07]) {
  const eyeRing = new THREE.Mesh(new THREE.SphereGeometry(0.025, 12, 8), M(0xf3c6a5));
  eyeRing.position.set(0.04, 0.02, z); head.add(eyeRing);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.017, 12, 8), mat.eye);
  eye.position.set(0.048, 0.022, z * 1.15); head.add(eye);
  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.005, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  glint.position.set(0.058, 0.03, z * 1.28); head.add(glint);
}
// 长嘴（上颚）
const BEAK_L = 0.62;
const upperShape = new THREE.Shape();
upperShape.moveTo(0, 0.035); upperShape.quadraticCurveTo(BEAK_L * 0.5, 0.03, BEAK_L, -0.005);
upperShape.lineTo(BEAK_L + 0.03, -0.03); upperShape.lineTo(BEAK_L - 0.02, -0.02);
upperShape.quadraticCurveTo(BEAK_L * 0.5, -0.008, 0, -0.025); upperShape.closePath();
const upperBeak = new THREE.Mesh(new THREE.ExtrudeGeometry(upperShape, { depth: 0.07, bevelEnabled: true, bevelSize: 0.012, bevelThickness: 0.012, bevelSegments: 3 }), mat.beak);
upperBeak.geometry.translate(0, 0, -0.035);
upperBeak.position.set(0.08, -0.01, 0); upperBeak.rotation.z = -0.22; upperBeak.castShadow = true; head.add(upperBeak);
const hook = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 6), M(0xd8572a)); hook.position.set(BEAK_L + 0.02, -0.025, 0); upperBeak.add(hook);
// 下颚 + 喉囊（会张合）
const jaw = new THREE.Group(); jaw.position.set(0.08, -0.04, 0); jaw.rotation.z = -0.22; head.add(jaw);
const lowerBar = new THREE.Mesh(new THREE.BoxGeometry(BEAK_L, 0.018, 0.075), mat.beak); lowerBar.position.x = BEAK_L / 2; jaw.add(lowerBar);
const pouchGeo = new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
const pouch = new THREE.Mesh(pouchGeo, mat.pouch);
pouch.scale.set(BEAK_L * 0.48, 0.12, 0.05); pouch.position.set(BEAK_L * 0.47, -0.005, 0); pouch.castShadow = true; jaw.add(pouch);

// 翅膀（握车把）
function makeWing(side) {
  const pivot = new THREE.Group(); pivot.position.set(0.05, 1.28, 0.2 * side);
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.bezierCurveTo(0.15, 0.1, 0.35, 0.02, 0.48, -0.16);
  shape.lineTo(0.42, -0.2); shape.bezierCurveTo(0.25, -0.15, 0.05, -0.2, -0.35, -0.12);
  shape.bezierCurveTo(-0.25, -0.02, -0.1, 0.02, 0, 0);
  const wing = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.03, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.015, bevelSegments: 2 }), mat.feather);
  wing.castShadow = true; pivot.add(wing);
  // 黑色飞羽
  for (let i = 0; i < 5; i++) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.012, 0.035), mat.wingTip);
    f.position.set(-0.35 + i * 0.03, -0.12 - i * 0.012, 0.015); f.rotation.z = 0.15 + i * 0.05; pivot.add(f);
  }
  pivot.rotation.y = side * 0.08;
  bird.add(pivot); return pivot;
}
const wingN = makeWing(1), wingF = makeWing(-1);

// 腿
const HIP_N = V(-0.18, 0.98, 0.12), HIP_F = V(-0.18, 0.98, -0.12);
const THIGH = 0.36, SHIN = 0.36;
function makeLeg() {
  const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.03, 1, 12), mat.feather);
  const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.018, 1, 10), mat.leg);
  const knee = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 8), mat.leg);
  const foot = new THREE.Group();
  for (const a of [-0.45, 0, 0.45]) {
    const toe = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.012, 0.022), mat.leg);
    toe.position.set(0.04 * Math.cos(a), 0, 0.04 * Math.sin(a)); toe.rotation.y = -a; foot.add(toe);
  }
  const web = new THREE.Mesh(new THREE.CircleGeometry(0.06, 12, -0.6, 1.2), mat.leg);
  web.rotation.x = -Math.PI / 2; foot.add(web);
  [thigh, shin, knee].forEach(m => m.castShadow = true);
  bird.add(thigh, shin, knee, foot);
  return { thigh, shin, knee, foot };
}
const legN = makeLeg(), legF = makeLeg();
function solveLeg(leg, hip, footP) {
  const d = new THREE.Vector3().subVectors(footP, hip);
  const dist = Math.min(d.length(), THIGH + SHIN - 0.001);
  const a = Math.atan2(d.y, d.x);
  const b = Math.acos((THIGH * THIGH + dist * dist - SHIN * SHIN) / (2 * THIGH * dist));
  const kAng = a + b; // 膝盖朝前上方
  const knee = V(hip.x + THIGH * Math.cos(kAng), hip.y + THIGH * Math.sin(kAng), (hip.z + footP.z) / 2);
  placeRod(leg.thigh, hip, knee); placeRod(leg.shin, knee, footP);
  leg.knee.position.copy(knee); leg.foot.position.copy(footP).add(V(0, 0.015, 0));
}

let actx = null, soundOn = false, windNode = null, windGain = null, waveGain = null;
function initAudio() {
  if (actx) return; actx = new AudioContext();
  const buf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  windNode = actx.createBufferSource(); windNode.buffer = buf; windNode.loop = true;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
  windGain = actx.createGain(); windGain.gain.value = 0;
  windNode.connect(lp).connect(windGain).connect(actx.destination);
  const lp2 = actx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 300;
  waveGain = actx.createGain(); waveGain.gain.value = 0;
  windNode.connect(lp2).connect(waveGain).connect(actx.destination);
  windNode.start();
}
function ringBell() {
  initAudio(); spawnNotes(); bellShake = 1;
  const t = actx.currentTime;
  for (const [f, delay] of [[2100, 0], [2100, 0.18]]) {
    for (const h of [1, 2.76, 5.4]) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f * h / 1.6; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t + delay); g.gain.exponentialRampToValueAtTime(0.25 / h, t + delay + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + delay + 0.9);
      o.connect(g).connect(actx.destination); o.start(t + delay); o.stop(t + delay + 1);
    }
  }
}

const C = (h) => new THREE.Color(h);
const palettes = [ // t: 0 黄昏深夜 → 0.35 日落 → 0.7 正午 → 1 清晨
  { t: 0.0, top: C(0x050818), mid: C(0x1a1840), bottom: C(0x0a0a18), sun: C(0x6677aa), fog: C(0x141633), light: 0.15, hemi: 0.25, elev: -0.15, star: 1 },

  { t: 0.7, top: C(0x3d8fe0), mid: C(0xbfe3ff), bottom: C(0x8fb9d8), sun: C(0xfff5e0), fog: C(0xcfe7ff), light: 3.0, hemi: 1.0, elev: 0.9, star: 0 },
  { t: 1.0, top: C(0x5a6fc0), mid: C(0xffc3a0), bottom: C(0x9a6f8a), sun: C(0xffd0a0), fog: C(0xffc8a8), light: 1.6, hemi: 0.6, elev: 0.15, star: 0 }
];
function applyTOD(t) {
  let a = palettes[0], b = palettes[1];
  for (let i = 0; i < palettes.length - 1; i++) if (t >= palettes[i].t && t <= palettes[i + 1].t) { a = palettes[i]; b = palettes[i + 1]; }
  const k = (t - a.t) / (b.t - a.t || 1);
  const L = (x, y) => x + (y - x) * k;
  skyUniforms.top.value.copy(a.top).lerp(b.top, k);
  skyUniforms.mid.value.copy(a.mid).lerp(b.mid, k);
  skyUniforms.bottom.value.copy(a.bottom).lerp(b.bottom, k);
  skyUniforms.sunColor.value.copy(a.sun).lerp(b.sun, k);
  scene.fog.color.copy(a.fog).lerp(b.fog, k);
  const elev = L(a.elev, b.elev);
  const dir = V(-0.6, elev, -1).normalize();
  skyUniforms.sunDir.value.copy(dir);
  sun.position.copy(dir).multiplyScalar(30); sun.target.position.set(0, 0, 0);
  sun.color.copy(a.sun).lerp(b.sun, k); sun.intensity = Math.max(0, L(a.light, b.light));
  hemi.intensity = L(a.hemi, b.hemi);
  const night = THREE.MathUtils.clamp(1 - sun.intensity / 1.2, 0, 1);
  starMat.opacity = L(a.star, b.star);
  headLamp.intensity = night * 25;
  lampBulbs.forEach(bu => bu.material.emissiveIntensity = night * 4);
  lhLight.material.emissiveIntensity = 0.3 + night * 4;
  beam.material.opacity = night * 0.12;
  mat.lampGlow.color.setScalar(0.6 + night * 0.8);
  seaMat.color.set(0x2a6f9e).multiplyScalar(0.35 + 0.65 * (1 - night));
}

// ---------- 动画循环 ----------
const clock = new THREE.Clock();
let crankAng = 0, distance = 0, curSpeed = 1;
const speedoEl = document.getElementById('kmh'), distEl = document.getElementById('dist');
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  curSpeed += (parseFloat(ui.speed.value) - curSpeed) * Math.min(1, dt * 2);
  const v = curSpeed * 4.2;            // 米/秒（场景单位）
  distance += v * dt;
  crankAng += v / R / 2.4 * dt;        // 齿比 2.4
  const wheelAng = crankAng * 2.4;

  wheelR.rotation.z = -wheelAng; wheelF.rotation.z = -wheelAng;
  crank.rotation.z = -crankAng;

  // 踏板位置（世界坐标，相对 rig）
  const a = -crankAng;
  const pN = V(BB.x + CRANK_L * Math.cos(a), BB.y + CRANK_L * Math.sin(a), 0.14);
  const pF = V(BB.x - CRANK_L * Math.cos(a), BB.y - CRANK_L * Math.sin(a), -0.14);
  pedalN.position.copy(pN); pedalF.position.copy(pF);

  // 身体起伏、左右轻摆
  const bob = Math.abs(Math.sin(crankAng)) * 0.015 * Math.min(curSpeed, 1.5);
  const sway = Math.sin(crankAng) * 0.03 * Math.min(curSpeed, 1.5);
  body.position.y = bob; body.rotation.x = sway;
  bike.rotation.x = sway * 0.6;
  // 头随节奏点头、偶尔张嘴
  head.rotation.z = Math.sin(t * 2.2) * 0.06;
  neckGroup.rotation.z = Math.sin(crankAng * 2) * 0.02;
  const gape = Math.max(0, Math.sin(t * 0.7)) ** 8;
  jaw.rotation.z = -0.22 - gape * 0.35;
  pouch.scale.y = 0.12 + gape * 0.08 + Math.sin(t * 9) * 0.008 * curSpeed;
  // 翅膀：随风抖、按铃时拍打
  bellShake = Math.max(0, bellShake - dt * 1.5);
  const flap = Math.sin(t * 20) * 0.5 * bellShake;
  wingN.rotation.x = -0.05 + flap + Math.sin(t * 7) * 0.01 * curSpeed;
  wingF.rotation.x = 0.05 - flap - Math.sin(t * 7) * 0.01 * curSpeed;
  wingN.position.y = wingF.position.y = 1.28 + bob;
  bellMesh.rotation.y = bellShake * Math.sin(t * 60);

  solveLeg(legN, V(HIP_N.x, HIP_N.y + bob, HIP_N.z), pN);
  solveLeg(legF, V(HIP_F.x, HIP_F.y + bob, HIP_F.z), pF);

  // 世界滚动
  for (const s of scrollers) {
    s.obj.position.x -= v * dt * s.parallax;
    if (s.obj.position.x < -SPAN / 2) s.obj.position.x += SPAN;
  }
  boat.position.x -= v * dt * 0.1; if (boat.position.x < -60) boat.position.x = 60;
  boat.position.y = Math.sin(t * 1.3) * 0.08; boat.rotation.x = Math.sin(t * 1.1) * 0.05;
  lighthouse.position.x -= v * dt * 0.08; if (lighthouse.position.x < -70) lighthouse.position.x = 70;
  beamPivot.rotation.y = t * 0.8;

  // 海浪
  const p = seaGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = seaBase[i * 3], z = seaBase[i * 3 + 2];
    const xx = x + distance * 0.3;
    p.setY(i, Math.sin(xx * 0.35 + t * 1.2) * 0.12 + Math.sin(z * 0.5 + t * 1.7) * 0.1 + Math.sin((xx + z) * 0.9 + t * 2.3) * 0.04);
  }
  p.needsUpdate = true; seaGeo.computeVertexNormals();

  // 海鸥
  for (const g of gulls) {
    const f = Math.sin(t * 6 * g.speed + g.phase) * 0.5;
    g.holderL.rotation.y = f; g.holderR.rotation.y = -f;
    g.g.position.x += (g.speed * 1.5 - v * 0.6) * dt;
    g.g.position.y += Math.sin(t + g.phase) * 0.003;
    if (g.g.position.x < -30) g.g.position.x = 30; if (g.g.position.x > 30) g.g.position.x = -30;
  }

  // 后轮扬尘
  for (let i = 0; i < PN; i++) {
    dustLife[i] -= dt * 1.2;
    if (dustLife[i] <= 0) {
      if (curSpeed < 0.1) { dustPos[i * 3 + 1] = -10; continue; }
      dustLife[i] = 1;
      dustPos[i * 3] = REAR.x - 0.1; dustPos[i * 3 + 1] = 0.03; dustPos[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
      dustVel[i].set(-v * (0.3 + Math.random() * 0.3), Math.random() * 0.5, (Math.random() - 0.5) * 0.4);
    }
    dustVel[i].y -= dt * 0.6;
    dustPos[i * 3] += dustVel[i].x * dt; dustPos[i * 3 + 1] = Math.max(0.01, dustPos[i * 3 + 1] + dustVel[i].y * dt); dustPos[i * 3 + 2] += dustVel[i].z * dt;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // 爱心
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i]; h.life -= dt;
    h.m.position.addScaledVector(h.v, dt); h.m.lookAt(camera.position);
    h.m.material.opacity = Math.min(1, h.life); h.m.scale.setScalar(1 + (1.6 - h.life) * 0.6);
    if (h.life <= 0) { scene.remove(h.m); hearts.splice(i, 1); }
  }

  // 镜头
  if (camMode === 'side') { camera.position.lerp(V(0.1, 1.1, 3.4), dt * 2); controls.target.lerp(V(0.1, 0.9, 0), dt * 3); }
  else if (camMode === 'front') { camera.position.lerp(V(2.1, 1.75, 0.9), dt * 2); controls.target.lerp(V(0.4, 1.5, 0), dt * 3); }
  else if (camMode === 'drone') { camera.position.lerp(V(-4 + Math.sin(t * 0.2) * 2, 6, 6), dt * 1.2); controls.target.lerp(V(0, 0.6, -2), dt * 2); }
  if (camMode !== 'orbit') camera.lookAt(controls.target);
  controls.update();

  // 声音
  if (actx && windGain) {
    windGain.gain.value += ((soundOn ? 0.05 * curSpeed : 0) - windGain.gain.value) * 0.05;
    waveGain.gain.value = soundOn ? 0.04 * (0.6 + 0.4 * Math.sin(t * 0.8)) : 0;
  }

  applyTOD(parseFloat(ui.tod.value));
  bloomPass.strength = parseFloat(ui.bloom.value);
  speedoEl.textContent = (v * 3.6 / 1.3).toFixed(0);
  distEl.textContent = (distance / 1300).toFixed(2);

  composer.render();
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

applyTOD(parseFloat(ui.tod.value));
const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 900);
tick();
</script>
</body>
</html>
