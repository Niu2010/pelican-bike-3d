<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行 · Pelican Ride 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#79b5d9;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  .panel {
    position:fixed; z-index:10; color:#fff;
    background:rgba(12,28,44,.46);
    border:1px solid rgba(255,255,255,.22);
    border-radius:16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow:0 10px 34px rgba(0,0,0,.28);
  }
  #titleCard { top:18px; left:18px; padding:14px 18px 12px; max-width:min(430px,86vw); }
  #titleCard h1 { font-size:22px; letter-spacing:1px; font-weight:700; }
  #titleCard p  { font-size:12.5px; opacity:.85; margin-top:4px; line-height:1.55; }

  #ctrlCard { left:18px; bottom:18px; padding:14px 16px; width:min(350px,86vw); }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .row:first-child { margin-top:0; }
  .lbl { font-size:12px; opacity:.85; width:40px; flex:none; letter-spacing:1px; }
  button {
    appearance:none; border:1px solid rgba(255,255,255,.35); cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff; font-size:12.5px;
    padding:6px 12px; border-radius:999px; transition:all .18s;
  }
  button:hover { background:rgba(255,255,255,.28); }
  button.on { background:#ffb340; border-color:#ffb340; color:#402a02; font-weight:700; }
  button:active { transform:scale(.96); }
  input[type=range] { flex:1; accent-color:#ffb340; height:4px; cursor:pointer; }
  #hud {
    top:18px; right:18px; padding:10px 16px; text-align:right;
    font-variant-numeric:tabular-nums;
  }
  #hud .big { font-size:24px; font-weight:700; }
  #hud .big small { font-size:12px; font-weight:400; opacity:.8; }
  #hud .sub { font-size:12px; opacity:.85; margin-top:2px; }
  #hint {
    position:fixed; right:18px; bottom:18px; z-index:10; color:rgba(255,255,255,.85);
    font-size:12px; text-shadow:0 1px 6px rgba(0,0,0,.45); text-align:right; line-height:1.7;
  }
  #loader {
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:#79b5d9; color:#fff; font-size:16px; letter-spacing:3px;
    transition:opacity .7s; 
  }
  @media (max-width:640px){ #hint{ display:none; } #titleCard p{ display:none; } }
</style>
</head>
<body>
<div id="app"></div>

<div class="panel" id="titleCard">
  <h1>🚲 鹈鹕骑行 · Pelican Ride 3D</h1>
  <p>一只大白鹈鹕蹬着小红车，车筐里还装着今天的鱼。Three.js 实时 3D：双腿骨骼 IK 跟着脚踏转、昼夜光影、自由镜头，全程序化建模，无外部素材。</p>
</div>

<div class="panel" id="hud">
  <div class="big"><span id="kmh">12.0</span> <small>km/h</small></div>
  <div class="sub">踏频 <span id="rpm">0</span> rpm · 里程 <span id="odo">0.00</span> km</div>
</div>

<div class="panel" id="ctrlCard">
  <div class="row">
    <span class="lbl">速度</span>
    <input type="range" id="speed" min="0" max="30" step="0.5" value="12">
    <button id="bell">🔔 铃铛</button>
  </div>
  <div class="row">
    <span class="lbl">视角</span>
    <button data-view="side"  class="viewBtn on">侧面</button>
    <button data-view="chase" class="viewBtn">追尾</button>
    <button data-view="front" class="viewBtn">迎面</button>
    <button data-view="close" class="viewBtn">特写</button>
    <button data-view="free"  class="viewBtn">自由</button>
  </div>
  <div class="row">
    <span class="lbl">时段</span>
    <button data-phase="day"    class="phaseBtn on">☀️ 白天</button>
    <button data-phase="dusk"   class="phaseBtn">🌇 黄昏</button>
    <button data-phase="night"  class="phaseBtn">🌙 夜晚</button>
  </div>
</div>

<div id="hint">自由视角：拖动旋转 · 滚轮缩放<br>空格 = 按铃铛</div>
<div id="loader">正在组装鹈鹕和自行车…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 基础 ================= */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe8f5, 55, 210);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0.4, 1.5, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.55;
controls.minDistance = 1.2; controls.maxDistance = 30;
controls.enabled = false;

/* ================= 天空穹顶 / 星星 / 光 ================= */
const skyUni = {
  topColor:     { value: new THREE.Color(0x3d8fd1) },
  horizonColor: { value: new THREE.Color(0xd8f1fc) },
  offset:       { value: 12 },
  exponent:     { value: 0.85 }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(420, 24, 14),
  new THREE.ShaderMaterial({
    uniforms: skyUni, side: THREE.BackSide, depthWrite:false, fog:false,
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 topColor; uniform vec3 horizonColor; uniform float offset; uniform float exponent; varying vec3 vP;
      void main(){ float h = normalize(vP+vec3(0.0,offset,0.0)).y; float t = pow(max(h,0.0), exponent);
      gl_FragColor = vec4(mix(horizonColor, topColor, t), 1.0); }`
  })
);
scene.add(sky);

const starGeo = new THREE.BufferGeometry();
{
  const pts = [];
  for (let i=0;i<900;i++){
    const a = Math.random()*Math.PI*2, e = Math.random()*Math.PI*0.48 + 0.05, r = 400;
    pts.push(Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
}
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:1.6, sizeAttenuation:false, transparent:true, opacity:0, fog:false, depthWrite:false });
scene.add(new THREE.Points(starGeo, starMat));

const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x6f9e57, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.4);
sun.position.set(18, 26, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-16; sun.shadow.camera.right=16;
sun.shadow.camera.top=16; sun.shadow.camera.bottom=-10;
sun.shadow.camera.far=90; sun.shadow.bias=-0.0004;
scene.add(sun); scene.add(sun.target);
const amb = new THREE.AmbientLight(0xffffff, 0.12);
scene.add(amb);

/* ================= 地面 / 道路 ================= */
function noiseCanvas(base, speck, n=2600, size=256){
  const c = document.createElement('canvas'); c.width=c.height=size;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,size,size);
  for (let i=0;i<n;i++){
    g.fillStyle = speck[Math.floor(Math.random()*speck.length)];
    g.globalAlpha = 0.05 + Math.random()*0.10;
    const s = 1 + Math.random()*2.4;
    g.fillRect(Math.random()*size, Math.random()*size, s, s);
  }
  return c;
}
const grassTex = new THREE.CanvasTexture(noiseCanvas('#79b657', ['#5f9c44','#93cc72','#6cab4e']));
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(60,60);
grassTex.colorSpace = THREE.SRGBColorSpace;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(700, 700),
  new THREE.MeshStandardMaterial({ map:grassTex, roughness:1 })
);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);

/* 道路纹理：沥青 + 中央虚线，滚动 offset 模拟前进 */
const roadCanvas = document.createElement('canvas'); roadCanvas.width = 256; roadCanvas.height = 256;
{
  const g = roadCanvas.getContext('2d');
  g.fillStyle = '#4a4d52'; g.fillRect(0,0,256,256);
  for (let i=0;i<2000;i++){
    g.fillStyle = Math.random()<0.5 ? '#43464b' : '#54575d';
    g.globalAlpha = 0.16; g.fillRect(Math.random()*256, Math.random()*256, 2, 2);
  }
  g.globalAlpha = 1;
  g.fillStyle = '#e8e9eb'; g.fillRect(0, 8, 256, 7); g.fillRect(0, 241, 256, 7);   // 两侧边线
  g.fillStyle = '#f7d54d'; g.fillRect(0, 118, 150, 14);                            // 中央虚线（一段）
}
const roadTex = new THREE.CanvasTexture(roadCanvas);
roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
roadTex.repeat.set(90, 1);
roadTex.colorSpace = THREE.SRGBColorSpace;
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(700, 6.4),
  new THREE.MeshStandardMaterial({ map:roadTex, roughness:0.94 })
);
road.rotation.x = -Math.PI/2; road.position.y = 0.01; road.receiveShadow = true;
scene.add(road);

/* ================= 两侧景物（循环滚动） ================= */
const M = {
  trunk:  new THREE.MeshStandardMaterial({ color:0x7a5230, roughness:1 }),
  leafA:  new THREE.MeshStandardMaterial({ color:0x4e9b47, roughness:1 }),
  leafB:  new THREE.MeshStandardMaterial({ color:0x67b85c, roughness:1 }),
  leafC:  new THREE.MeshStandardMaterial({ color:0x3e8a44, roughness:1 }),
  wallA:  new THREE.MeshStandardMaterial({ color:0xf2e3c6, roughness:.9 }),
  wallB:  new THREE.MeshStandardMaterial({ color:0xd9e6f2, roughness:.9 }),
  roof:   new THREE.MeshStandardMaterial({ color:0xb5523c, roughness:.9 }),
  pole:   new THREE.MeshStandardMaterial({ color:0x3c4148, roughness:.6, metalness:.5 }),
  lampGlow: new THREE.MeshStandardMaterial({ color:0xfff3c4, emissive:0xffca55, emissiveIntensity:0 }),
};
function shadowed(root){ root.traverse(o=>{ if(o.isMesh){ o.castShadow = true; } }); return root; }

function makeTree(){
  const g = new THREE.Group();
  const h = 0.9 + Math.random()*0.9;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.11,h,7), M.trunk);
  trunk.position.y = h/2; g.add(trunk);
  const leafMat = [M.leafA, M.leafB, M.leafC][Math.floor(Math.random()*3)];
  const blobs = 2 + Math.floor(Math.random()*2);
  for (let i=0;i<blobs;i++){
    const r = 0.5 + Math.random()*0.45;
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), leafMat);
    s.position.set((Math.random()-0.5)*0.5, h + 0.25 + i*0.34, (Math.random()-0.5)*0.5);
    s.scale.y = 0.85; g.add(s);
  }
  return shadowed(g);
}
function makeHouse(){
  const g = new THREE.Group();
  const w = 2.2 + Math.random()*1.4, d = 2.0 + Math.random()*0.8, h = 1.5 + Math.random()*0.7;
  const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), Math.random()<0.5 ? M.wallA : M.wallB);
  body.position.y = h/2; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.78, 0.9, 4), M.roof);
  roof.position.y = h + 0.45; roof.rotation.y = Math.PI/4; roof.scale.set(1, 1, d/w); g.add(roof);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(0.42,0.5),
    new THREE.MeshStandardMaterial({ color:0xffe9a8, emissive:0xffca55, emissiveIntensity:0 }));
  win.position.set(w*0.22, h*0.55, d/2 + 0.01); g.add(win);
  g.userData.win = win;
  return shadowed(g);
}
function makeLamp(){
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.06,3.4,8), M.pole);
  pole.position.y = 1.7; g.add(pole);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.8,8), M.pole);
  arm.rotation.z = Math.PI/2; arm.position.set(0.35, 3.38, 0); g.add(arm);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), M.lampGlow);
  bulb.position.set(0.72, 3.3, 0); g.add(bulb);
  return shadowed(g);
}
const movers = [];   // {obj, speedScale}
function scatter(obj, zMin, zMax, bothSides=true){
  obj.position.x = -80 + Math.random()*160;
  let z = zMin + Math.random()*(zMax-zMin);
  if (bothSides && Math.random()<0.5) z = -z;
  obj.position.z = z;
  scene.add(obj); movers.push(obj); return obj;
}
for (let i=0;i<26;i++) scatter(makeTree(), 5.2, 26);
for (let i=0;i<7;i++)  scatter(makeHouse(), 10, 30);
for (let i=0;i<10;i++){ const l = scatter(makeLamp(), 4.4, 4.4, true); l.rotation.y = l.position.z > 0 ? Math.PI : 0; }
const houses = movers.filter(o=>o.userData.win);

/* 远山 */
{
  const rock = new THREE.MeshStandardMaterial({ color:0x8fb6cc, roughness:1 });
  const snow = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.8 });
  for (let i=0;i<9;i++){
    const h = 26 + Math.random()*22;
    const mtn = new THREE.Mesh(new THREE.ConeGeometry(h*0.9, h, 5), rock);
    const a = (i/9)*Math.PI*2 + Math.random()*0.4;
    mtn.position.set(Math.cos(a)*230, h/2 - 2, Math.sin(a)*230 - 60);
    scene.add(mtn);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(h*0.32, h*0.3, 5), snow);
    cap.position.copy(mtn.position); cap.position.y = h - h*0.15 - 2;
    scene.add(cap);
  }
}
/* 云 */
const clouds = [];
function makeCloud(){
  const g = new THREE.Group();
  const cm = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, transparent:true, opacity:0.94 });
  const n = 3 + Math.floor(Math.random()*3);
  for (let i=0;i<n;i++){
    const r = 1.4 + Math.random()*1.8;
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), cm);
    s.position.set(i*1.7 - n*0.8, (Math.random()-0.5)*0.6, (Math.random()-0.5)*1.2);
    s.scale.y = 0.55; g.add(s);
  }
  g.position.set(-140 + Math.random()*280, 26 + Math.random()*16, -60 + Math.random()*70);
  const sc = 1.6 + Math.random()*1.6; g.scale.setScalar(sc);
  scene.add(g); clouds.push(g); return g;
}
for (let i=0;i<8;i++) makeCloud();

/* 远处飞鸟 */
const birds = [];
{
  const bm = new THREE.MeshBasicMaterial({ color:0x2c3e50, side:THREE.DoubleSide });
  for (let i=0;i<4;i++){
    const b = new THREE.Group();
    const wgeo = new THREE.PlaneGeometry(0.85, 0.26);
    const wl = new THREE.Mesh(wgeo, bm); wl.position.x = -0.42;
    const wr = new THREE.Mesh(wgeo, bm); wr.position.x =  0.42;
    const pl = new THREE.Group(); pl.add(wl); const pr = new THREE.Group(); pr.add(wr);
    b.add(pl); b.add(pr); b.userData = { pl, pr, off: Math.random()*10, r: 26 + i*7, h: 15 + i*2.2, sp: 0.05 + Math.random()*0.03 };
    scene.add(b); birds.push(b);
  }
}
/* 风线（速度感） */
const streaks = [];
{
  const sm = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0 });
  for (let i=0;i<36;i++){
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.014, 0.014), sm);
    s.position.set((Math.random()-0.5)*16, 0.3 + Math.random()*2.4, (Math.random()-0.5)*3.4);
    scene.add(s); streaks.push(s);
  }
  streaks.mat = sm;
}

/* ================= 工具 ================= */
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
function tube(a, b, r, mat, seg=10){
  const d = V3(b.x-a.x, b.y-a.y, b.z-a.z), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(V3(0,1,0), d.normalize());
  return m;
}
const UP = V3(0,1,0);
function aim(mesh, a, b){
  const d = V3(b.x-a.x, b.y-a.y, b.z-a.z), len = Math.max(d.length(), 0.001);
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(UP, d.normalize());
}

/* ================= 自行车 ================= */
const bike = new THREE.Group(); scene.add(bike);
const frameMat = new THREE.MeshStandardMaterial({ color:0xd8342c, roughness:.32, metalness:.35 });
const chromeMat= new THREE.MeshStandardMaterial({ color:0xd7dde3, roughness:.25, metalness:.9 });
const darkMat  = new THREE.MeshStandardMaterial({ color:0x23262b, roughness:.6, metalness:.3 });
const tireMat  = new THREE.MeshStandardMaterial({ color:0x1d1f24, roughness:.95 });

const A_R = V3(-0.52, 0.34, 0), A_F = V3(0.52, 0.34, 0), BB = V3(-0.04, 0.40, 0);
const SEAT = V3(-0.30, 0.86, 0), HT = V3(0.40, 0.84, 0), HB = V3(0.46, 0.66, 0);
const WHEEL_R = 0.34, CRANK_L = 0.17;

function makeWheel(){
  const w = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R, 0.034, 12, 36), tireMat); w.add(tire);
  const rim  = new THREE.Mesh(new THREE.TorusGeometry(0.295, 0.011, 8, 32), chromeMat); w.add(rim);
  for (let i=0;i<8;i++){
    const sp = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.575, 0.006), chromeMat);
    sp.rotation.z = i * Math.PI/8; w.add(sp);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.07, 10), darkMat);
  hub.rotation.x = Math.PI/2; w.add(hub);
  return w;
}
const wheelR = makeWheel(); wheelR.position.copy(A_R); bike.add(wheelR);
const wheelF = makeWheel(); wheelF.position.copy(A_F); bike.add(wheelF);

/* 车架 */
bike.add(tube(BB, A_R, 0.021, frameMat));                 // 后下叉
bike.add(tube(V3(-0.28,0.82,0), A_R, 0.019, frameMat));   // 后上叉
bike.add(tube(BB, SEAT, 0.023, frameMat));                // 座管
bike.add(tube(V3(-0.28,0.84,0), HT, 0.023, frameMat));    // 上管
bike.add(tube(BB, HB, 0.025, frameMat));                  // 下管
bike.add(tube(HT, HB, 0.026, frameMat));                  // 头管
bike.add(tube(V3(0.44,0.70, 0.045), V3(0.52,0.34, 0.045), 0.014, frameMat)); // 前叉
bike.add(tube(V3(0.44,0.70,-0.045), V3(0.52,0.34,-0.045), 0.014, frameMat));
bike.add(tube(SEAT, V3(-0.30,0.90,0), 0.016, chromeMat)); // 座杆
const seat = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.05, 0.15), darkMat);
seat.position.set(-0.31, 0.925, 0); bike.add(seat);
bike.add(tube(HT, V3(0.37,0.95,0), 0.016, chromeMat));    // 把立
{
  const bar = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.014, 8, 20, Math.PI), darkMat);
  bar.position.set(0.35, 0.95, 0); bar.rotation.set(0, Math.PI/2, Math.PI); bike.add(bar);
  const gripL = tube(V3(0.35,0.95, 0.085), V3(0.35,0.95, 0.16), 0.017, darkMat);
  const gripR = tube(V3(0.35,0.95,-0.085), V3(0.35,0.95,-0.16), 0.017, darkMat);
  bike.add(gripL); bike.add(gripR);
}
/* 挡泥板 */
for (const [ax, flip] of [[A_R, 1], [A_F, -1]]){
  const f = new THREE.Mesh(new THREE.TorusGeometry(0.375, 0.016, 8, 24, 1.9), frameMat);
  f.position.copy(ax); f.rotation.z = flip > 0 ? 0.65 : Math.PI - 0.65 - 1.9 + 1.9;
  f.rotation.z = 0.62; if (flip < 0) f.rotation.z = Math.PI - 0.62 - 1.9;
  bike.add(f);
}
/* 牙盘 / 曲柄 / 链条 */
const crank = new THREE.Group(); crank.position.copy(BB); bike.add(crank);
{
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.105, 0.014, 24), darkMat);
  ring.rotation.x = Math.PI/2; crank.add(ring);
  for (const s of [1,-1]){
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.034, CRANK_L, 0.014), chromeMat);

function makeLeg(side){
  const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.020, 1, 8), orange);
  const shin  = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.015, 1, 8), orangeD);
  const foot  = new THREE.Group();
  const fsole = new THREE.Mesh(new THREE.BoxGeometry(0.115, 0.016, 0.052), orangeD);
  foot.add(fsole);
  for (const dx of [-0.028, 0.028]){
    const toe = new THREE.Mesh(new THREE.ConeGeometry(0.013, 0.055, 6), orangeD);
    toe.rotation.z = -Math.PI/2; toe.position.set(0.082, 0, dx);
    foot.add(toe);
  }
  bike.add(thigh); bike.add(shin); bike.add(foot);
  return { thigh, shin, foot, hip: V3(-0.13, 1.00, side * 0.125), side };
}
const legNear = makeLeg(1), legFar = makeLeg(-1);
const L1 = 0.32, L2 = 0.37;
function solveLeg(leg, target){
  const H = leg.hip, T = target;
  const dx = T.x - H.x, dy = T.y - H.y;
  let d = Math.hypot(dx, dy);
  d = Math.min(d, L1 + L2 - 0.005);
  const a = Math.atan2(dy, dx);
  const cosK = (L1*L1 + d*d - L2*L2) / (2 * L1 * d);
  const ka = a + Math.acos(THREE.MathUtils.clamp(cosK, -1, 1));
  const K = V3(H.x + Math.cos(ka)*L1, H.y + Math.sin(ka)*L1, H.z);
  const T2 = V3(H.x + Math.cos(a)*d, H.y + Math.sin(a)*d, T.z);
  aim(leg.thigh, H, K);
  aim(leg.shin, K, T2);
  leg.foot.position.copy(T2); leg.foot.position.y += 0.012;
}

const PHASES = {
  day:   { top:0x3d8fd1, hor:0xd8f1fc, fog:0xcfe8f5, sun:0xfff2d8, sunI:2.4, sunPos:[18,26,12],  hemi:0.95, amb:0.12, stars:0,    head:0,  lamp:0,   win:0,   exp:1.05 },
  dusk:  { top:0x35507a, hor:0xffb37a, fog:0xe8b48f, sun:0xff9a3c, sunI:1.6, sunPos:[-20,7,10],  hemi:0.50, amb:0.08, stars:0.25, head:30, lamp:1.6, win:0.9, exp:1.00 },
  night: { top:0x060d1f, hor:0x11283f, fog:0x0a1626, sun:0x9db8e8, sunI:0.5, sunPos:[-14,22,-8], hemi:0.16, amb:0.05, stars:1,    head:70, lamp:2.6, win:1.5, exp:0.95 },
};
const cur = { top:new THREE.Color(PHASES.day.top), hor:new THREE.Color(PHASES.day.hor),
  fog:new THREE.Color(PHASES.day.fog), sun:new THREE.Color(PHASES.day.sun),
  sunI:2.4, sunPos:V3(18,26,12), hemi:0.95, amb:0.12, stars:0, head:0, lamp:0, win:0, exp:1.05 };
let phaseTarget = PHASES.day;
function applyPhase(dt){
  const k = 1 - Math.exp(-dt * 2.0), P = phaseTarget;
  cur.top.lerp(new THREE.Color(P.top), k); cur.hor.lerp(new THREE.Color(P.hor), k);
  cur.fog.lerp(new THREE.Color(P.fog), k); cur.sun.lerp(new THREE.Color(P.sun), k);
  cur.sunPos.lerp(V3(...P.sunPos), k);
  for (const f of ['sunI','hemi','amb','stars','head','lamp','win','exp'])
    cur[f] += (P[f] - cur[f]) * k;
  skyUni.topColor.value.copy(cur.top); skyUni.horizonColor.value.copy(cur.hor);
  scene.fog.color.copy(cur.fog);
  sun.color.copy(cur.sun); sun.intensity = cur.sunI; sun.position.copy(cur.sunPos);
  hemi.intensity = cur.hemi; amb.intensity = cur.amb;
  starMat.opacity = cur.stars;
  headlight.intensity = cur.head;
  lampLensMat.emissiveIntensity = 0.15 + cur.lamp;
  M.lampGlow.emissiveIntensity = cur.lamp;
  renderer.toneMappingExposure = cur.exp;
  for (const h of houses) h.userData.win.material.emissiveIntensity = cur.win;
}

const VIEWS = {

let viewName = 'side';

/* ================= 铃铛（WebAudio 合成） ================= */
let audioCtx = null, bellT = 0;
function ringBell(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for (const [f, g] of [[2210, 0.22], [2960, 0.12], [1560, 0.06]]){
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      gn.gain.setValueAtTime(g, t0);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
      o.connect(gn).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.85);
    }
  } catch(e) { /* 无音频环境时只做动画 */ }
  bellT = 1;
}

/* ================= UI ================= */
const speedSlider = document.getElementById('speed');
const kmhEl = document.getElementById('kmh'), rpmEl = document.getElementById('rpm'), odoEl = document.getElementById('odo');

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let speedKmh = 0, crankAngle = 0, odo = 0, elapsed = 0, firstFrame = true;
const pedalNearT = new THREE.Vector3(), pedalFarT = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* 速度与传动 */
  const target = parseFloat(speedSlider.value);
  speedKmh += (target - speedKmh) * (1 - Math.exp(-dt * 1.6));
  const v = speedKmh / 3.6;                                   // m/s
  const wheelW = v / WHEEL_R;                                 // 车轮角速度
  const crankW = wheelW * 0.45;                               // 踏频（齿轮比）
  crankAngle += crankW * dt;
  odo += v * dt / 1000;
  wheelF.rotation.z -= wheelW * dt;
  wheelR.rotation.z -= wheelW * dt;
  crank.rotation.z = -crankAngle;
  const effort = THREE.MathUtils.clamp(speedKmh / 16, 0, 1);  // 蹬踏发力感

  /* 世界滚动 */
  roadTex.offset.x -= (v * dt) / (700 / 90);
  for (const o of movers){
    o.position.x -= v * dt;
    if (o.position.x < -85) o.position.x += 170;
  }
  for (let i=0;i<clouds.length;i++){
    const c = clouds[i];
    c.position.x -= dt * (0.35 + (i % 3) * 0.18) + v * dt * 0.05;
    if (c.position.x < -160) c.position.x = 160;
  }
  for (const b of birds){
    const u = b.userData, t = elapsed * u.sp + u.off;
    b.position.set(Math.cos(t) * u.r, u.h + Math.sin(elapsed * 0.9 + u.off) * 0.9, Math.sin(t) * u.r - 16);
    const t2 = t + 0.02;
    b.lookAt(Math.cos(t2) * u.r, b.position.y, Math.sin(t2) * u.r - 16);
    const flap = Math.sin(elapsed * 9 + u.off) * 0.55;
    u.pl.rotation.z = flap; u.pr.rotation.z = -flap;
  }
  streaks.mat.opacity = THREE.MathUtils.clamp((speedKmh - 13) / 34, 0, 0.5);
  if (streaks.mat.opacity > 0.01){
    for (const s of streaks){
      s.position.x -= (v * 2.1 + 7) * dt;
      if (s.position.x < -9){ s.position.x = 9; s.position.y = 0.3 + Math.random()*2.4; s.position.z = (Math.random()-0.5)*3.4; }
    }
  }

  /* 鹈鹕骑行动作 */
  const bobY = Math.sin(crankAngle * 2) * 0.020 * effort;
  rider.position.y = bobY;
  rider.rotation.z = Math.sin(crankAngle * 2 + 0.6) * 0.022 * effort;
  bike.rotation.x = Math.sin(crankAngle) * 0.012 * effort;
  headGrp.rotation.z = Math.sin(crankAngle * 2 + 1.2) * 0.05 * effort + Math.sin(elapsed * 0.8) * 0.02;
  headGrp.rotation.y = Math.sin(elapsed * 0.45) * 0.14;
  bellT = Math.max(0, bellT - dt * 1.4);
  if (bellT > 0) headGrp.rotation.y += Math.sin(bellT * 42) * 0.12 * bellT;
  beakGrp.rotation.z = -0.02 + Math.sin(elapsed * 1.3) * 0.018 - bellT * 0.22;
  pouch.scale.y = 0.60 + Math.sin(crankAngle * 2 + 0.8) * 0.055 * (0.4 + effort);
  pouch.rotation.z = Math.sin(crankAngle + 0.5) * 0.06;
  wingNear.rotation.x = -0.05 + Math.sin(crankAngle * 2) * 0.075 * effort;
  wingFar.rotation.x  =  0.05 - Math.sin(crankAngle * 2) * 0.075 * effort;
  tail.rotation.y = Math.sin(crankAngle * 2 + 2.0) * 0.17 * (0.4 + effort);
  fishTail.rotation.y = Math.sin(elapsed * 6) * 0.45;

  /* 双腿 IK：脚锁定脚踏 */
  pedalNearT.set(BB.x + Math.sin(crankAngle) * CRANK_L, BB.y + Math.cos(crankAngle) * CRANK_L, 0.10);
  pedalFarT.set(BB.x - Math.sin(crankAngle) * CRANK_L, BB.y - Math.cos(crankAngle) * CRANK_L, -0.10);
  legNear.hip.y = 1.00 + bobY; legFar.hip.y = 1.00 + bobY;
  solveLeg(legNear, pedalNearT);
  solveLeg(legFar, pedalFarT);

  /* 相机 */
  if (viewName !== 'free'){
    const vw = VIEWS[viewName];
    const k = 1 - Math.exp(-dt * 3.2);
    camPos.lerp(vw.pos, k); camLook.lerp(vw.look, k);
    camera.position.copy(camPos); camera.lookAt(camLook);
  } else {
    controls.update();
    camPos.copy(camera.position);
  }

  applyPhase(dt);

  /* HUD */
  kmhEl.textContent = speedKmh.toFixed(1);
  rpmEl.textContent = Math.round(crankW * 60 / (2 * Math.PI));
  odoEl.textContent = odo.toFixed(2);

  renderer.render(scene, camera);
  if (firstFrame){
    firstFrame = false;
    const l = document.getElementById('loader');
    l.style.opacity = '0'; setTimeout(() => l.remove(), 750);
  }
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
