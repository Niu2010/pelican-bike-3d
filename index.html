<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鹈鹕骑车抓鱼 · Pelican Coast Ride</title>
<meta name="description" content="戴头盔墨镜、系红围巾的鹈鹕在海岸公路上骑车抓鱼。Three.js 实时 3D 小游戏。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="scoreBox">
    <div class="big"><span id="score">0</span><small> 分</small></div>
    <div>🐟 <span id="fishCount">0</span> 条 · 最高 <span id="best">0</span></div>
    <div id="comboBox" class="combo"></div>
  </div>
  <div id="statBox">
    <div class="big"><span id="kmh">0</span><small> km/h</small></div>
    <div>里程 <span id="dist">0.00</span> km</div>
    <div><span id="todIcon">🌇</span> <span id="todText">黄昏</span> · 踏频 <span id="rpm">0</span></div>
  </div>
  <div id="camName">🎥 追尾</div>
  <div id="autoBadge" class="hidden">🤖 自动驾驶中 · 按任意键接管</div>
  <div id="toasts"></div>
  <div id="bottomBar">
    <button id="btnAch" title="成就 (H)">🏆 <span id="achCount">0</span>/14</button>
    <button id="btnCam" title="切换镜头 (C)">🎥</button>
    <button id="btnMute" title="声音 (M)">🔊</button>
    <span id="quality" title="按帧率自动调整">画质 高</span>
  </div>
  <div id="keysHelp">W/S 加减速 · A/D 变道 · 空格 跳 · T 展翅抬前轮 · C/1-5 镜头 · H 成就 · M 静音</div>
</div>

<!-- 触屏按钮 -->
<div id="touch" class="hidden">
  <div class="tpad left">
    <button data-k="KeyA">◀</button>
    <button data-k="KeyD">▶</button>
  </div>
  <div class="tpad mid">
    <button data-k="KeyW">▲</button>
    <button data-k="KeyS">▼</button>
  </div>
  <div class="tpad right">
    <button data-k="KeyT">🪽</button>
    <button data-k="Space" class="jump">跳</button>
  </div>
</div>

<!-- 成就面板 -->
<div id="achPanel" class="hidden">
  <div class="card">
    <h2>🏆 成就</h2>
    <div id="achList"></div>
    <button id="achClose">关闭</button>
  </div>
</div>

<!-- 开始界面 -->
<div id="start">
  <div class="card">
    <h1>🐦 鹈鹕骑车抓鱼</h1>
    <p class="sub">戴着头盔墨镜、系着红围巾，沿海岸公路一路追鱼</p>
    <div class="keys">
      <div><kbd>W</kbd><kbd>S</kbd> 加速 / 减速</div>
      <div><kbd>A</kbd><kbd>D</kbd> 变道抓鱼</div>
      <div><kbd>空格</kbd> 跳起来接飞鱼</div>
      <div><kbd>T</kbd> 展翅抬前轮</div>
      <div><kbd>C</kbd> / <kbd>1</kbd>–<kbd>5</kbd> 切换镜头</div>
      <div><kbd>H</kbd> 成就 · <kbd>M</kbd> 静音</div>
    </div>
    <p class="tip">路面上的鱼骑过去就能叼起，跃出海面的飞鱼要跳起来接。不操作时它会自己去追鱼。</p>
    <button id="startBtn">开始骑行 🚲</button>
    <p id="loadMsg" class="tip">加载中…</p>
  </div>
</div>

<div id="popups"></div>

<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "three/addons/": "./lib/addons/"
}}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
